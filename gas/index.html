<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTM 2026 課程作業繳交系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a2e; --muted:#5d6a6e; --line:#ddd6c8; --soft:#f7f3ea;
  --accent:#1f5f5b; --accent-soft:#e3efec; --warn:#b5462f; --warn-soft:#f8e4dc;
  --ok:#2f7a3d; --ok-soft:#e1f0e2; --gold:#b9862d; --gold-soft:#f6ecd6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:17px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.demo-bar{background:#2b2b2b;color:#f3e9d2;text-align:center;padding:6px 12px;font-size:14px}
#zoomRoot{min-height:100vh}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;font-weight:700}
header.top .who{color:var(--muted);font-size:15px}
.fs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fs button{border:none;background:var(--card);padding:6px 12px;cursor:pointer;min-height:40px;font-weight:700}
.fs button+button{border-left:1px solid var(--line)}
.fs button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 26px;font-size:19px}
.btn.small{padding:6px 12px;font-size:15px;min-height:36px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1280px;margin:0 auto;padding:20px 24px 120px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;border-bottom:2px solid var(--line)}
.tab{padding:10px 16px;border:none;background:none;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{display:inline-block;background:var(--warn);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;margin-left:6px;vertical-align:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.pill.draft{background:var(--gold-soft);color:#8a6420}
.pill.lead{background:var(--accent-soft);color:var(--accent)}
.pill.grey{background:#ece8df;color:var(--muted)}
h2{font-size:23px;margin:0 0 4px}
h3{font-size:18px;margin:0 0 8px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;background:var(--soft);font-size:15px}
td.num,th.num{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(31,42,46,.5);display:grid;place-items:center;z-index:70;padding:16px;overflow:auto}
.overlay .card{max-width:600px;width:100%;max-height:92vh;overflow:auto}
.overlay .card.wide{max-width:760px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.deadline{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--gold-soft);color:#7a5517;font-weight:500;font-size:15px}
.deadline.over{background:var(--warn-soft);color:var(--warn)}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head .sub{color:var(--muted)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}

/* login */
.login-wrap{min-height:calc(100vh - 34px);display:grid;place-items:center;padding:24px}
.login{width:min(440px,100%)}
.login h1{font-size:28px;margin:0 0 4px}
.field{display:block;margin:16px 0}
.field>span{display:block;font-weight:500;margin-bottom:6px}
.field input,.field textarea,.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}
.field input:focus,.field textarea:focus,.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.err{color:var(--warn);min-height:1.6em;font-weight:500}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.files .file{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink);text-decoration:none}
.files .file:hover{border-color:var(--accent);background:var(--accent-soft)}.files .file span{font-size:24px}.files .file small{color:var(--muted);font-size:14px}
.demo-pick{display:grid;gap:10px;margin:10px 0}.demo-pick button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.demo-pick button:hover{border-color:var(--accent);background:var(--accent-soft)}.demo-pick b{display:block;font-size:18px}.demo-pick span{font-size:15px;color:var(--muted)}
.demo-accts{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px;font-size:15px}
.demo-accts button{width:100%;justify-content:flex-start;margin:6px 0}

/* home */
.tasks{display:grid;gap:14px}
.task{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:18px 20px}
.task .no{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;background:var(--accent-soft);color:var(--accent)}
.task.done .no{background:var(--ok-soft);color:var(--ok)}
.task.wait .no{background:#ece8df;color:var(--muted)}
.task .t{font-size:20px;font-weight:700}
.task .d{color:var(--muted)}
@media (max-width:640px){.task{grid-template-columns:44px 1fr}.task .no{width:40px;height:40px;font-size:17px}.task .act{grid-column:1/-1}.task .act .btn{width:100%}}

/* essay */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.editor textarea{min-height:480px;resize:vertical;line-height:1.8}
.counter{margin-top:8px}
.counter .info{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.counter.over .info{color:var(--warn);font-weight:700}
.counter.over .bar i{background:var(--warn)}
.counter.near .bar i{background:var(--gold)}
.saved{font-size:14px;color:var(--muted)}
.preview-col{position:sticky;top:84px}
.preview-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
.seg{display:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:none;background:var(--card);padding:10px;font-weight:700;min-height:44px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
@media (max-width:960px){
  .editor{grid-template-columns:1fr}.preview-col{position:static}.seg{display:flex}
  .editor[data-mv="edit"] .preview-col{display:none}.editor[data-mv="preview"] .edit-col{display:none}
}
.help{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:15px;margin-top:10px}
.help ul{margin:4px 0 0;padding-left:1.2em}
.pages{display:flex;flex-direction:column;gap:14px;align-items:center}
.page-shell{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden;position:relative;flex:none}
.page{width:794px;height:1123px;padding:76px;position:absolute;left:0;top:0;transform-origin:0 0;font-family:"Noto Serif TC","Noto Sans TC",serif;color:#000}
.page .clip{position:relative;overflow:hidden}
.page .flow{position:absolute;left:0;right:0}
.page .pno{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:14px;color:#666;font-family:"Noto Sans TC",sans-serif}
.flow .hd{}
.flow .hd .meta{display:flex;justify-content:center;gap:2.2em;font-family:"Noto Sans TC",sans-serif;font-weight:500;padding-top:8px}
.flow .hd .ttl{text-align:center;font-weight:700;border-bottom:2px solid #000;padding-bottom:8px}
.flow p{margin:0;text-indent:2em;text-align:justify;word-break:break-all}
.fit-warn{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-weight:500;margin-bottom:10px}
details.hist summary{cursor:pointer;font-weight:700;padding:6px 0;min-height:36px}

/* peer */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;cursor:pointer;min-height:44px;text-align:center;line-height:1.3}
.chip small{display:block;font-size:13px;color:var(--muted)}
.chip.done{border-color:var(--ok-soft);background:var(--ok-soft)}
.chip.done small{color:var(--ok);font-weight:700}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:960px){.viewer{grid-template-columns:1fr}.viewer .panel{position:static!important}}
.slides{display:flex;flex-direction:column;gap:14px}
.slide{aspect-ratio:16/9;border-radius:6px;padding:7%;display:flex;flex-direction:column;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.slide .k{font-size:clamp(12px,1.6vw,16px);opacity:.8}
.slide .h{font-size:clamp(20px,3.4vw,40px);font-weight:700;line-height:1.25;margin:6px 0}
.slide ul{font-size:clamp(14px,1.9vw,22px);margin:10px 0 0;padding-left:1.2em}
.slides canvas{width:100%;height:auto;box-shadow:0 2px 8px rgba(0,0,0,.12);border-radius:4px;background:#fff}
.scorebox{display:flex;align-items:center;gap:8px;margin:8px 0}
.scorebox input{width:120px;font-size:34px;font-weight:700;text-align:center;padding:6px;border:2px solid var(--line);border-radius:12px}
.scorebox input:focus{outline:none;border-color:var(--accent)}
.scorebox .btn{min-width:60px;font-weight:700}
textarea.cmt{width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical;background:#fff}

/* matrix & ranking */
.matrix td.num input{width:80px;text-align:center;padding:6px;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:6px}
.matrix tr.avg td{background:var(--soft);font-weight:700}
.matrix tr.final td{background:var(--accent-soft);font-weight:700}
.progwrap{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:16px;margin-bottom:18px;align-items:start}.progwrap.two{grid-template-columns:1fr 1fr}
@media (max-width:860px){.progwrap,.progwrap.two{grid-template-columns:1fr}}
.prog .ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}.prog .pp{font-size:44px;font-weight:700;line-height:1;color:var(--accent)}.prog .pp small{font-size:20px;margin-left:2px}.prog .pp.done{color:var(--ok)}
.pbar{height:14px;background:#e9e4d9;border-radius:999px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#2f8a7f,#1f5f5b);border-radius:999px;transition:width .4s}.pbar.done i{background:var(--ok)}.pbar.mini{height:6px;grid-column:1/-1}
.pitems{margin-top:14px;display:grid;gap:10px}.pit{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:16px}.pit b{font-size:15px}
.ptable td,.ptable th{padding:10px 12px}
.rs2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rs2 select{font:inherit;font-size:16px;padding:4px 6px;margin-left:6px;border-radius:8px;border:1px solid var(--line)}@media (max-width:760px){.rs2{grid-template-columns:1fr}}
.lt input{width:68px;text-align:center;font:inherit;font-weight:700;padding:5px;border:1px solid var(--line);border-radius:8px;background:#fff}.lt tr.conflict td{background:#fff3cf}
.rk-d0{background:#dcefdc}.rk-d1{background:#eef6e6}.rk-d2{background:#fbf1d6}.rk-d3{background:#f8e2c8}.rk-d4{background:#f6d3c6}.rk-d5{background:#efbcae}
.rounds{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.rounds button{font:inherit;font-size:17px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.rounds button.on{border-color:var(--accent);background:var(--accent-soft)}.rounds button small{display:block;font-size:14px;color:var(--muted)}
.podium{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}.podium>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.podium .p{font-size:15px;color:var(--muted)}.podium .g{font-size:22px;font-weight:700;margin:2px 0}.podium .s{font-size:14px;color:var(--muted)}.podium>div:first-child{border:2px solid var(--gold);background:var(--gold-soft)}
@media (max-width:760px){.podium{grid-template-columns:repeat(4,1fr)}}
.ptab{border-collapse:collapse;font-size:17px;margin:0 auto}.ptab th,.ptab td{text-align:center;padding:6px 8px}
.ptab .pc{width:42px;border:1px solid #e3ded3}.ptab thead th{border-bottom:2px solid var(--ink)}.ptab .pg{min-width:76px;font-variant-numeric:tabular-nums}
.ptab .pg small{display:block;font-size:12px;font-weight:400;color:var(--muted)}.ptab .pb{border-right:2px solid var(--ink)}.ptab .pf{background:#f1eee8}
.ptab input{width:56px;text-align:center;font:inherit;font-weight:700;padding:3px;border:1px solid var(--line);border-radius:6px;background:#fff}
.pl0{background:#fff}.pl1{background:#e6e6e6}.pl2{background:#b9b9b9}.pl3{background:#4a4a4a;color:#fff}
.ps,.ps-hi,.ps-lo{outline:2px solid #222;outline-offset:-2px;font-weight:700}.ps-hi{box-shadow:inset 0 0 0 5px #f3c9c0}.ps-lo{box-shadow:inset 0 0 0 5px #c8dbef}
.ptie{display:block;font-size:12px;color:var(--warn)}
.plegend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:14px}.plegend>span:not(.muted){border:1px solid #ccc;padding:2px 10px;border-radius:4px}
.mine td{background:#fffbe9}
.cell-empty{color:#bbb}
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-item .rc{grid-column:1/-1;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.rank-item .rc textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;resize:vertical;font-size:16px}
.rank-item .mc{grid-column:1/-1;font-size:14px;color:var(--muted)}
.rank-item .mc summary{cursor:pointer}
@media (max-width:640px){.rank-item .rc{grid-template-columns:1fr}.rank-item .rc .lbl{display:none}}
.rank-item{display:grid;grid-template-columns:36px 84px 1fr auto auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rank-item.dragging{opacity:.4}
.rank-item.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rank-item.conflict{border-color:var(--gold);background:#fffaf0}
.handle{cursor:grab;color:var(--muted);font-size:22px;text-align:center;user-select:none}
.rk{font-weight:700;font-size:20px;color:var(--accent)}
.rank-item input{width:90px;font-size:22px;font-weight:700;text-align:center;padding:6px;border:1px solid var(--line);border-radius:8px}
.arrows{display:flex;gap:4px}
.arrows .btn{min-width:44px;padding:6px}
@media (max-width:640px){.rank-item{grid-template-columns:28px 64px 1fr;}.rank-item .sc,.rank-item .arrows{grid-column:span 1}.rank-item .sc{grid-column:2/4}.rank-item .arrows{grid-column:1/-1;justify-content:flex-end}}

/* teacher */
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.dash .card .n{font-size:34px;font-weight:700;line-height:1.2}
.dash .card .n small{font-size:18px;color:var(--muted);font-weight:500}
.namechips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.namechips span{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:15px}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.split{grid-template-columns:1fr}}
.list-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list-item:hover{background:var(--soft)}
.list-item.on{background:var(--accent-soft)}
.scroll{max-height:72vh;overflow:auto}
.gradebar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--accent);z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.gradebar .in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.gradebar input.sc{width:100px;font-size:26px;font-weight:700;text-align:center;padding:6px;border:2px solid var(--line);border-radius:10px}
.gradebar input.cm{flex:1;min-width:200px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px}
details.menu{position:relative;display:inline-block}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .items{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;min-width:280px;z-index:25}
details.menu .items button{width:100%;justify-content:flex-start;border:none;background:none}
details.menu .items button:hover{background:var(--soft)}
details.menu .items label{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:15px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.upload{border:2px dashed var(--line);border-radius:14px;padding:32px;text-align:center;background:#fff;cursor:pointer;display:block}
.upload.drag{border-color:var(--accent);background:var(--accent-soft)}
.note{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:15px;color:#6b4e16;margin-bottom:16px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.msgbox{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:640px){main{padding:14px 12px 120px}header.top{padding:10px 12px}header.top h1{font-size:17px}.card{padding:16px}}

/* 作業說明 */
.bw{display:grid;grid-template-columns:210px minmax(0,1fr);gap:36px;align-items:start;max-width:1080px;margin:0 auto}
.toc{position:sticky;top:96px;display:flex;flex-direction:column;gap:2px;font-size:16px}
.toc .tt{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin:0 0 6px 12px}
.toc a{display:block;padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;border-left:3px solid transparent;line-height:1.4}
.toc a:hover{background:var(--soft);color:var(--ink)}

"在這學期的課程中，我最大的收穫是學會從不同角度看待同一個問題。過去我習慣只從自己的經驗出發，認為只要努力就能解決大部分的困難，但透過小組討論與課堂案例，我發現許多問題背後都有制度、文化與資源分配的因素。",

, "2": "僅有名次，無小組分數", "3": "組長綜合評分", "4": "團體評分分數", "5": "原始均分", "6": "六人平均分數", "7": "小組綜合評分"}, "note": "各組計分口徑不同（組長定分、成員平均等），平均分數僅供參考，排名以平均名次為主。第二組只提供名次。"}};

/* ================= A4 排版引擎（13.5～14pt、兩倍行高） ================= */
const PAGE={w:794,h:1123,m:76}, FS_MAX=14, FS_MIN=13.5, FS_STEP=0.25, LINE=2, PGAP=0.5; // 字級 14→13.5pt 自動調整、兩倍行高、段落間距半行
let measurer;
function flowHTML(stu,essay,lh,fs){
  const px=fs*96/72, gap=Math.round(lh*PGAP);
  const paras=(essay.text||"").split(/\n/).filter(p=>p.trim()!=="").map((p,i)=>`<p style="${i?`margin-top:${gap}px`:""}">${esc(p)}</p>`).join("");
  return `<div class="flow" style="font-size:${px}px;line-height:${lh}px;width:${PAGE.w-2*PAGE.m}px">
    <div class="hd" data-hd style="font-size:${px*0.95}px;line-height:1.7;padding-bottom:10px;margin-bottom:${Math.round(lh*0.6)}px">
      <div class="ttl" style="font-size:${px*1.2}px">${esc(essay.title||"（未填寫題目）")}</div>
      <div class="meta"><span>${esc(showId(stu))}</span><span>第 ${stu.group} 組</span><span>${esc(stu.name)}</span></div>
    </div><div>${paras}</div></div>`;
}
// 依實際每一行的位置分頁，確保不會把一行字切成兩半
function layout(stu,essay){
  let L; for(let fs=FS_MAX;fs>=FS_MIN-1e-6;fs-=FS_STEP){L=layoutAt(stu,essay,fs);if(L.fits)break} return L;
}
function layoutAt(stu,essay,fs){
  if(!measurer){measurer=document.createElement("div");measurer.style.cssText="position:absolute;left:-99999px;top:0;visibility:hidden";measurer.className="page";document.body.appendChild(measurer)}
  const lh=Math.round(fs*96/72*LINE), avail=PAGE.h-2*PAGE.m; // 頁碼放在下邊界內，不佔內文空間
  measurer.innerHTML=flowHTML(stu,essay,lh,fs);
  const flow=measurer.querySelector(".flow"), base=flow.getBoundingClientRect().top, hd=flow.querySelector("[data-hd]");
  const units=[{t:0,b:hd.getBoundingClientRect().bottom-base}];
  flow.querySelectorAll("p").forEach(p=>{
    const r=document.createRange(); r.selectNodeContents(p);
    const tops=new Map(); [...r.getClientRects()].forEach(x=>{const t=Math.round(x.top-base);if(!tops.has(t))tops.set(t,t)});
    const pr=p.getBoundingClientRect(), pt=pr.top-base, n=Math.max(1,Math.round(pr.height/lh));
    for(let k=0;k<n;k++) units.push({t:pt+k*lh,b:pt+(k+1)*lh});
  });
  const starts=[0], heights=[]; let st=0, last=0;
  units.forEach(u=>{ if(u.b-st>avail){heights.push(last-st);st=u.t;starts.push(st)} last=u.b; });
  heights.push(last-st);
  return {fs,lh,starts,heights,pages:starts.length,fits:starts.length<=2,total:last};
}
function renderPages(container,stu,essay,width){
  const L=layout(stu,essay), scale=width/PAGE.w, shown=Math.min(2,L.pages);
  let html="";
  for(let i=0;i<shown;i++){
    html+=`<div class="page-shell" style="width:${PAGE.w*scale}px;height:${PAGE.h*scale}px"><div class="page" style="transform:scale(${scale})">
      <div class="clip" style="height:${L.heights[i]}px">${flowHTML(stu,essay,L.lh,L.fs).replace('class="flow" style="','class="flow" style="top:'+(-L.starts[i])+'px;')}</div>
      <div class="pno">第 ${i+1} 頁，共 ${shown} 頁${essay.v?`｜v${essay.v}｜${fmtTime(essay.at)} 繳交`:""}</div></div></div>`;
  }
  container.innerHTML=html;
  return L;
}

async function saveFile(filename,blob){
  try{const dl=window.claude?await window.claude.use("downloads"):null; if(dl){await dl.save({filename,data:blob});return true}}
  catch(e){

  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();

function cleanPaste(t){
  let n=0; t=t.replace(/\r\n?/g,"\n");
  const out=[];
  for(const line of t.split("\n")){
    let c=line.replace(/^[\s　 ]+|[\s　 ]+$/g,""); if(c!==line) n++;
    c=c.replace(/[ \t 　]{2,}/g,()=>{n++;return " "});
    if(c==="") {n++;continue}
    out.push(c);
  }
  return {text:out.join("\n"),n:Math.max(0,n)};
}

// 個人評分的最後一步：第一名、最後一名的理由（依自己的分數預選，可以改）

function bindReasons(u){

function bindPeer(){
  const u=S.user, mine=()=>DB.peer[u.id]||{};
  if(!ownUploaded(u)){$$("[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go));return}
  const g=S.sel||ALLG.find(x=>!mine()[x]&&DB.pdfs[x])||1, idx=ALLG.indexOf(g);

  mountPdfs();
  const sc=$("#sc"); if(!sc){const sk=$("#skipG");if(sk)sk.onclick=()=>nav("peer",ALLG[idx+1]);return}

    if(BACKEND) api("savePeer",{g,score:v,comment:cm}).catch(err=>{delete DB.peer[u.id][g];toast(`第 ${g} 組的評分沒存成功：${err.message}`)});

// 組長：送出小組評分。表格列出全組每個人給的分數、組員平均、組長調整（＋/−）、調整後分數、組長綜合排名，
// 再寫綜合排名第一名、最後一名的理由。全組（包括組長自己）都完成個人評分前，看不到組員的分數。
function initRank(){
  const g=S.user.group, fin=DB.finals[g], adj={}, ranks={};
  if(fin){ALLG.forEach(t=>{adj[t]=fin.adj?.[t]??0;ranks[t]=fin.ranks[t]});S.rk={adj,ranks,comments:{...(fin.comments||{})},overall:fin.overall||"",best:fin.best||"",worst:fin.worst||""};return}
  ALLG.forEach(t=>adj[t]=0); S.rk={adj,ranks,comments:{},overall:"",best:"",worst:""}; autoRanks();

const rkScore=t=>{const a=avgFor(S.user.group,t);return a==null?null:Math.max(0,Math.min(100,Math.round(a+(+S.rk.adj[t]||0))))};
function autoRanks(){const o=[...ALLG].sort((a,b)=>(rkScore(b)??-1)-(rkScore(a)??-1)||(avgFor(S.user.group,b)??0)-(avgFor(S.user.group,a)??0)||a-b);o.forEach((t,i)=>S.rk.ranks[t]=i+1)}
const rkAt=n=>ALLG.find(t=>+S.rk.ranks[t]===n);

  <h3 style="font-size:18px;margin:18px 0 8px">① 全組評分與組長綜合排名</h3>

      <td class="num"><b>${avgFor(g,t)??"—"}</b></td>

      <td class="num"><input class="rkin" data-rk-t="${t}" type="number" min="1" max="7" value="${S.rk.ranks[t]??""}"></td></tr>`).join("")}</tbody></table></div>
  <div class="row" style="margin-top:10px;gap:10px"><button class="btn small" id="autoRank">依調整後分數重新排名</button><div id="rankMsg" style="min-height:1.6em"></div></div>

}
function rankProblems(){
  const r=ALLG.map(t=>+S.rk.ranks[t]), bad=r.some(x=>!(x>=1&&x<=7))||new Set(r).size!==7;
  const conflict=new Set(); ALLG.forEach(a=>ALLG.forEach(b=>{const sa=rkScore(a),sb=rkScore(b);if(sa!=null&&sb!=null&&sa>sb&&+S.rk.ranks[a]>+S.rk.ranks[b]){conflict.add(a);conflict.add(b)}}));
  return {bad,conflict};
}
function updateRankMeta(){
  const {bad,conflict}=rankProblems();
  ALLG.forEach(t=>{const sc=$(`[data-sc-t="${t}"]`);if(sc)sc.textContent=rkScore(t)??"—";$(`[data-lt="${t}"]`)?.classList.toggle("conflict",conflict.has(t))});
  $("#rankMsg").innerHTML=bad?`<span style="color:var(--warn);font-weight:500">名次要剛好是 1 到 7，不能重複</span>`:conflict.size?`<span style="color:#8a6420;font-weight:500">黃色的組別：分數高的排在分數低的後面。如果是刻意的，仍然可以送出。</span>`:`<span style="color:var(--ok);font-weight:500">✓ 名次沒問題</span>`;
  const b=rkAt(1),w=rkAt(7); if($("#bestLbl")){$("#bestLbl").textContent=`第一名：第 ${bad||!b?"—":b} 組，理由`;$("#worstLbl").textContent=`最後一名：第 ${bad||!w?"—":w} 組，理由`}
}

    if(!best||!worst){toast("請寫下第一名和最後一名的理由");($("#bestR").value?$("#worstR"):$("#bestR")).focus();return}

  const parts=[]; t.split(/(?<=？)/).map(x=>x.trim()).filter(Boolean).forEach(x=>{if(parts.length&&(x.length<=8||parts[parts.length-1].length<=8))parts[parts.length-1]+=x;else parts.push(x)});

}
const parseQs=t=>(t||"").split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d+(?:\.\d+)*)\s+([\s\S]+)$/);return m?[m[1],m[2]]:["・",x]});

function refsHTML(t){
  let html="", k=0;

    if(line.startsWith("##")){html+=`<div class="rt">${esc(line.replace(/^#+\s*/,""))}</div>`;k=0;return}
    const parts=line.split("|").map(x=>x.trim()), url=parts[parts.length-1], title=parts[0], src=parts.length>2?parts[1]:"";
    k++; let host=""; try{host=new URL(url).hostname.replace(/^www\./,"")}catch(e){html+=`<div class="refs-bad">${esc(line)}</div>`;return}

function bindUpload(){
  $$("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();nav(b.dataset.go)});
  const take=async f=>{if(!f)return;if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){toast("只能上傳 PDF 檔");return}
    if(f.size>20*1024*1024){toast("檔案超過 20 MB，請先壓縮");return}
    const old=DB.pdfs[S.user.group];if(old?.url)URL.revokeObjectURL(old.url);
    const first=!old, url=URL.createObjectURL(f);
    busy("正在檢查 PDF…");
    let pages=null; try{const lib=window.pdfjsLib;if(lib){lib.GlobalWorkerOptions.workerSrc="https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";pages=(await lib.getDocument(url).promise).numPages}}catch(e){}
    busy();
    if(BACKEND){ try{ await call("uploadReport",{data:await blobToB64(f),orig:f.name,pages},{busyMsg:"正在上傳，請不要關閉頁面…"}) }catch(err){ return }
      const p=DB.pdfs[S.user.group]; if(p){p.blob=f;p.url=url} }
    else DB.pdfs[S.user.group]={kind:"pdf",name:`第${S.user.group}組_簡報.pdf`,orig:f.name,blob:f,url,pages,at:Date.now()};
    toast(pages>maxPages()?`已上傳，但有 ${pages} 頁，超過 ${maxPages()} 頁上限`:first&&ALLG.every(g=>DB.pdfs[g])?"簡報已上傳。七組都上傳了，系統會自動寄簡報連結給老師":first&&PEER()?"簡報已上傳，全組現在可以開始評分了":first?"小組報告已上傳":"小組報告已更新");render()};
  $("#pdfIn").onchange=e=>take(e.target.files[0]);
  const d=$("#drop");d.ondragover=e=>{e.preventDefault();d.classList.add("drag")};d.ondragleave=()=>d.classList.remove("drag");d.ondrop=e=>{e.preventDefault();d.classList.remove("drag");take(e.dataTransfer.files[0])};
  mountPdfs();
}

// 互評結果：只呈現小組層級（各組給的名次、分數、評語），不呈現個人評分
// R = {ranks:{評分組:{被評組:名次}}, scores, comments?, overall?, best?, worst?, basis?, at?, note?}
function liveRound(){
  const R={ranks:{},scores:{},comments:{},overall:{},best:{},worst:{},at:{}};
  ALLG.forEach(g=>{const f=DB.finals[g];if(!f)return;R.ranks[g]=f.ranks;R.scores[g]=f.scores;R.comments[g]=f.comments||{};R.overall[g]=f.overall||"";R.best[g]=f.best||"";R.worst[g]=f.worst||"";R.at[g]=f.at});
  return R;
}
function roundStats(R){
  const raters=ALLG.filter(g=>R.ranks[g]);
  const st=ALLG.map(t=>{
    const rk=raters.map(g=>R.ranks[g][t]).filter(x=>x!=null), sc=raters.map(g=>R.scores[g]?.[t]).filter(x=>x!=null&&x!=="");
    return {t,avgRank:rk.length?rk.reduce((a,b)=>a+b,0)/rk.length:null,avgScore:sc.length?sc.reduce((a,b)=>a+ +b,0)/sc.length:null};
  });
  const order=st.filter(x=>x.avgRank!=null).sort((a,b)=>a.avgRank-b.avgRank||(b.avgScore??0)-(a.avgScore??0));
  order.forEach((x,i)=>x.final=i+1);
  return {raters,st,order};
}
const gName=g=>`第${"一二三四五六七"[g-1]}組`;
const f1=x=>x==null?"—":(Math.round(x*100)/100).toString();

  if(profKey) return `<h3 style="margin:4px 0 10px">小組互評整合表 <span class="muted" style="font-size:15px;font-weight:400">${raters.length} / 7 組已送出</span></h3>${profTable(R,profKey,live)}`+roundDetails(R,live,raters);
  return `
  <h3 style="margin:4px 0 10px">七組綜合排名 <span class="muted" style="font-size:15px;font-weight:400">依各組給的名次取平均，數字越小越好（${raters.length} / 7 組已送出）</span></h3>
  <div class="podium">${order.map(x=>`<div><div class="p">第 ${x.final} 名</div><div class="g">${gName(x.t)}</div><div class="s">平均名次 ${f1(x.avgRank)}${x.avgScore!=null?`<br>平均 ${f1(x.avgScore)} 分`:""}</div></div>`).join("")}</div>
  <div class="card" style="padding:0;overflow:auto"><table class="matrix">
    <thead><tr><th>被評組 ＼ 評分組</th>${ALLG.map(g=>`<th class="num">${gName(g)}評</th>`).join("")}<th class="num">平均名次</th><th class="num">綜合排名</th></tr></thead>
    <tbody>${ALLG.map(t=>`<tr><td><b>${gName(t)}</b></td>${ALLG.map(g=>{const r=R.ranks[g]?.[t];if(r==null)return `<td class="num"><span class="cell-empty">${R.ranks[g]?"—":"未送出"}</span></td>`;const d=Math.min(5,Math.abs(r-(byT[t].final||r)));return `<td class="num rk-d${d}">${r}</td>`}).join("")}<td class="num"><b>${f1(byT[t].avgRank)}</b></td><td class="num"><b>${byT[t].final??"—"}</b></td></tr>`).join("")}
    ${live?`<tr class="final"><td>老師評分</td>${ALLG.map(t=>`<td class="num">${DB.tGroup[t]?.score??"—"}</td>`).join("")}<td></td><td></td></tr>`:""}</tbody></table></div>
  <div class="muted" style="font-size:14px;margin:8px 2px 0">格子是該組給的名次。顏色表示和綜合排名差幾名：
    <span class="rk-d0" style="padding:1px 8px;border-radius:4px">相同</span> <span class="rk-d1" style="padding:1px 8px;border-radius:4px">差 1</span> <span class="rk-d2" style="padding:1px 8px;border-radius:4px">差 2</span> <span class="rk-d3" style="padding:1px 8px;border-radius:4px">差 3</span> <span class="rk-d4" style="padding:1px 8px;border-radius:4px">差 4</span> <span class="rk-d5" style="padding:1px 8px;border-radius:4px">差 5 以上</span></div>
  <details class="card" style="margin-top:16px;padding:14px 18px"><summary style="cursor:pointer;font-weight:700;font-size:17px">各組給的分數</summary>
    <div style="overflow:auto;margin-top:10px"><table class="matrix"><thead><tr><th>被評組 ＼ 評分組</th>${ALLG.map(g=>`<th class="num">${gName(g)}評</th>`).join("")}<th class="num">平均分數</th></tr></thead>
    <tbody>${ALLG.map(t=>`<tr><td><b>${gName(t)}</b></td>${ALLG.map(g=>{const v=R.scores[g]?.[t];return `<td class="num">${v==null||v===""?'<span class="cell-empty">—</span>':f1(+v)}</td>`}).join("")}<td class="num"><b>${f1(byT[t].avgScore)}</b></td></tr>`).join("")}
    ${R.basis?`<tr class="avg"><td>計分方式</td>${ALLG.map(g=>`<td style="font-size:13px;font-weight:400">${esc(R.basis[g]||"")}</td>`).join("")}<td></td></tr>`:""}</tbody></table></div>
    ${R.note?`<div class="muted" style="font-size:14px;margin-top:8px">${esc(R.note)}</div>`:""}</details>
${roundDetails(R,live,raters)}`;
}
function bindProf(R,key,live){
  const ov=S.prof[key];
  $$("[data-pfin]").forEach(i=>i.onchange=()=>{const t=+i.dataset.pfin,v=+i.value;if(!(v>=1&&v<=7)){toast("Final 要是 1 到 7");i.value=ov[t]?.final??"";return}
    ov[t]={...ov[t],final:v,grade:ov[t]?.gradeEdited?ov[t].grade:95-v};render()});
  $$("[data-pgr]").forEach(i=>i.onchange=()=>{const t=+i.dataset.pgr,v=+i.value;if(!(v>=0&&v<=100)){toast("成績要在 0 到 100 之間");return}ov[t]={...ov[t],grade:v,gradeEdited:true}});
  $$("[data-pcsv]").forEach(b=>b.onclick=()=>{
    const {rows}=profCalc(R), val=sel=>$(sel)?.value??"";
    dlCsv(`小組互評_老師格式_${key}.csv`,[["",...ALLG.map(g=>CN[g-1]),"OR w Self","Rank","OR w/o Self","Rank","Final","Grades"],
      ...rows.map(r=>[CN[r.t-1],...ALLG.map(g=>R.ranks[g]?.[r.t]??""),r.w?.toFixed(2)??"",r.wR??"",r.wo?.toFixed(2)??"",r.woR??"",val(`[data-pfin="${r.t}"]`),val(`[data-pgr="${r.t}"]`)])])});
  $$("[data-papply]").forEach(b=>b.onclick=async()=>{
    const g2=ALLG.map(t=>({t,v:+($(`[data-pgr="${t}"]`).value)})).filter(x=>$(`[data-pgr="${x.t}"]`).value!=="");
    const ok=await dialog({title:"存成小組報告成績？",body:g2.map(x=>`第 ${x.t} 組：${x.v} 分`).join("<br>")+"<br><br>會覆蓋「小組報告評分」裡已經打的分數，評語不變。",buttons:[{l:"取消",v:false},{l:"存成成績",v:true,primary:true}]});
    if(!ok) return;
    for(const x of g2){DB.tGroup[x.t]={score:x.v,comment:DB.tGroup[x.t]?.comment||""};if(BACKEND)await api("gradeGroup",{g:x.t,...DB.tGroup[x.t]}).catch(e=>toast("沒存成功："+e.message))}
    toast("已存成小組報告成績");render()});
}

function roundDetails(R,live,raters){
  return `  ${R.best?`<h3 style="margin:28px 0 10px">各組評語：第一名與最後一名的原因</h3>
  ${raters.map(g=>{const rk=R.ranks[g],first=ALLG.find(t=>rk[t]===1),last=ALLG.find(t=>rk[t]===7);return `<div class="card" style="margin-bottom:10px;padding:14px 18px">
    <div style="font-weight:700;font-size:18px;margin-bottom:6px">${gName(g)}的評語</div>
    <div style="margin-bottom:6px"><span class="pill ok">第一名：${first?gName(first):"—"}</span> ${esc(R.best[g]||"")}</div>
    <div><span class="pill no">最後一名：${last?gName(last):"—"}</span> ${esc(R.worst[g]||"")}</div></div>`}).join("")}`:""}
  ${!live&&R.comments?`<h3 style="margin:28px 0 10px">各組送出的評語</h3>
  ${raters.map(g=>`<details class="card" style="margin-bottom:10px;padding:14px 18px"><summary style="cursor:pointer;font-weight:700;font-size:17px">${gName(g)}的評分</summary><div style="margin-top:10px">${finalTable({scores:R.scores[g],ranks:R.ranks[g],comments:R.comments[g]||{},overall:R.overall?.[g]||""})}</div></details>`).join("")}`:""}
  ${live?`<h3 style="margin:28px 0 10px">各組送出的評語</h3>
  ${ALLG.map(g=>{const f=DB.finals[g];return f?`<details class="card" style="margin-bottom:10px;padding:14px 18px"><summary style="cursor:pointer;font-weight:700;font-size:17px">${gName(g)}的評分（${fmtTime(f.at)} 送出）${f.overall?'<span class="muted" style="font-weight:400">｜有整體評語</span>':""}</summary><div style="margin-top:10px">${finalTable(f)}</div></details>`:`<div class="card muted" style="margin-bottom:10px;padding:14px 18px">${gName(g)}還沒送出</div>`}).join("")}`:""}`;
}
// 老師的互評整合表（照李老師的格式）：列是被評組，欄是評分組，對角線是自評
// OR w Self＝含自評的平均名次，OR w/o Self＝不含自評的平均名次；Final 預設依 w/o Self 排序（同分再看 w Self），老師可以改；Grades 預設 第1名94、往下每名少 1 分
const CN="一二三四五六七八九十";
function profCalc(R){
  const raters=ALLG.filter(g=>R.ranks[g]);
  const rows=ALLG.map(t=>{
    const all=raters.map(g=>R.ranks[g][t]).filter(x=>x!=null), wo=raters.filter(g=>g!==t).map(g=>R.ranks[g][t]).filter(x=>x!=null);
    return {t,w:all.length?all.reduce((a,b)=>a+b,0)/all.length:null,wo:wo.length?wo.reduce((a,b)=>a+b,0)/wo.length:null};
  });
  const rankBy=k=>{const v=rows.filter(r=>r[k]!=null);rows.forEach(r=>r[k+"R"]=r[k]==null?null:1+v.filter(x=>x[k]<r[k]-1e-9).length)};
  rankBy("w"); rankBy("wo");
  [...rows].filter(r=>r.wo!=null).sort((a,b)=>a.wo-b.wo||(a.w??9)-(b.w??9)||a.t-b.t).forEach((r,i)=>{r.final=i+1});
  rows.forEach(r=>{r.tie=r.wo!=null&&rows.some(x=>x!==r&&x.wo!=null&&Math.abs(x.wo-r.wo)<1e-9)});
  return {raters,rows};
}
function profTable(R,key,live){
  const {rows}=profCalc(R), ov=(S.prof=S.prof||{})[key]=S.prof[key]||{};
  const fin=r=>ov[r.t]?.final??r.final, grade=r=>ov[r.t]?.grade??(live&&DB.tGroup[r.t]?.score!=null?DB.tGroup[r.t].score:(fin(r)?95-fin(r):""));
  const f2=x=>x==null?"":x.toFixed(2);
  const cell=(g,t)=>{const v=R.ranks[g]?.[t];const r=rows[t-1];if(v==null)return `<td class="pc"></td>`;
    const d=Math.abs(v-(fin(r)||v)), lv=d>=6?3:d>=4?2:d>=2?1:0, self=g===t;
    return `<td class="pc pl${lv}${self?(v<=2?" ps-hi":v>=6?" ps-lo":" ps"):""}">${v}</td>`};
  return `<div class="card prof" style="padding:14px;overflow:auto">
  <table class="ptab"><thead><tr><th class="pc"></th>${ALLG.map(g=>`<th class="pc">${CN[g-1]}</th>`).join("")}<th class="pg">OR w Self<small>含自評平均</small></th><th class="pg">Rank<small>名次</small></th><th class="pg">OR w/o Self<small>不含自評平均</small></th><th class="pg pb">Rank<small>名次</small></th><th class="pg pf">Final<small>最終名次</small></th><th class="pg pf">Grades<small>成績</small></th></tr></thead>
  <tbody>${rows.map(r=>`<tr><th class="pc">${CN[r.t-1]}</th>${ALLG.map(g=>cell(g,r.t)).join("")}
    <td class="pg">${f2(r.w)}</td><td class="pg">${r.wR??""}</td><td class="pg">${f2(r.wo)}</td><td class="pg pb">${r.woR??""}</td>
    <td class="pg pf"><input data-pfin="${r.t}" value="${fin(r)??""}" inputmode="numeric">${r.tie?'<span class="ptie" title="不含自評平均同分，請確認先後">同分</span>':""}</td>
    <td class="pg pf"><input data-pgr="${r.t}" value="${grade(r)}" inputmode="numeric"></td></tr>`).join("")}</tbody></table>
  <div class="plegend"><span class="pl0">0 to 1</span><span class="pl1">2 to 3</span><span class="pl2">4 to 5</span><span class="pl3">6 to 7</span><span class="ps-hi">Self Rank 1 or 2</span><span class="ps-lo">Self Rank 6 or 7</span>
    <span class="muted">格子是各組給的名次；灰階是和 Final 差幾名，框線是自評。Final、Grades 可以直接改。</span></div>
  <div class="row" style="margin-top:12px;gap:10px"><button class="btn" data-pcsv="${key}">⬇ 下載這張表（Excel 可開）</button>${live?`<button class="btn primary" data-papply="${key}">把 Grades 存成小組報告成績</button>`:""}</div></div>`;
}
function viewTPeer(){
  const cur=PR(), r=S.sel?.r||cur;
  const label=n=>n<cur?"已結束":n===cur?"進行中":"尚未開始";
  const body=r<cur?(DB.history[r]?roundView(DB.history[r],false,`r${r}`):`<div class="card empty"><b>第 ${r} 次互評沒有資料</b></div>`)
    :r===cur?roundView(liveRound(),true,`r${r}`)
    :`<div class="card empty"><div style="font-size:44px">🗓</div><b>第 ${r} 次互評還沒開始</b>在「⚙ 系統設定」結束第 ${cur} 次互評後，就會開始第 ${cur+1} 次。</div>`;
  return `<div class="page-head"><div><h2>小組互評結果</h2><div class="sub">只呈現各組送出的小組評分（名次、分數、評語），不列出個人評分。</div></div><span class="spacer"></span>${downloadMenu()}</div>
  <div class="rounds">${Array.from({length:PEER_ROUNDS},(_,i)=>i+1).map(n=>`<button class="${n===r?"on":""}" data-rd="${n}"><b>第 ${n} 次互評</b><small>${label(n)}</small></button>`).join("")}</div>
  ${DB.history[r]?.title&&r<cur?`<div class="note info">${esc(DB.history[r].title)}：系統上線前已完成，結果由各組繳交的互評檔整理匯入。</div>`:""}
  ${body}`;
}
// 學員、組長看已結束的互評結果（進行中的那一次不公開）
function viewSResults(){
  const done=Object.keys(DB.history).map(Number).filter(n=>n<PR()).sort((a,b)=>a-b), r=S.sel?.r&&done.includes(S.sel.r)?S.sel.r:done[done.length-1];
  if(!r) return `<div class="page-head"><div><h2>互評結果</h2></div></div><div class="card empty"><b>還沒有已結束的互評</b></div>`;
  return `<div class="page-head"><div><h2>互評結果</h2><div class="sub">已結束的互評，每個人都能看。進行中的第 ${PR()} 次互評，要等老師結束後才會公開。</div></div></div>
  <div class="rounds">${done.map(n=>`<button class="${n===r?"on":""}" data-rd="${n}"><b>第 ${n} 次互評</b><small>已結束</small></button>`).join("")}</div>
  ${roundView(DB.history[r],false)}`;
}
function bindSResults(){$$("[data-rd]").forEach(b=>b.onclick=()=>go("results",{r:+b.dataset.rd}))}
function bindTPeer(){
  bindDownloadMenu();
  { const cur=PR(), r=S.sel?.r||cur; if(r<cur&&DB.history[r]) bindProf(DB.history[r],`r${r}`,false); else if(r===cur) bindProf(liveRound(),`r${r}`,true); }
  $$("[data-rd]").forEach(b=>b.onclick=()=>go("t-peer",{r:+b.dataset.rd}));
}

/* ================= 路由 ================= */
function render(){
  if(S.flush){const f=S.flush;S.flush=null;f()}
  const app=$("#app"), u=S.user; S.leave=null; $("#modal").innerHTML="";
  applyZoom();
  if(!u){
    if(S.tab==="tlogin"){app.innerHTML=viewTeacherLogin();bindTLogin();return}
    if(!PUBLIC_TABS.includes(S.tab)) S.tab="home";
    if(S.tab==="brief") S.tab="home";
    app.innerHTML=publicShell(viewPublicHome());
    bindPublic(); bindBrief();
    $("#openLogin").onclick=()=>openLogin(null);
    $("#tLogin").onclick=e=>{e.preventDefault();S.tab="tlogin";render()};
    $$("[data-tab]").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
    $$("[data-z]").forEach(b=>b.onclick=()=>{const d=+b.dataset.z;let i=ZL.indexOf(ZOOM);if(i<0)i=1;i=d===0?1:Math.max(0,Math.min(ZL.length-1,i+d));ZOOM=ZL[i];try{localStorage.setItem("hwZoom",ZOOM)}catch(e){}render()});
    window.scrollTo(0,0); return;
  }
  let tabs,V;
  if(u.teacher){
    tabs=[{k:"home",l:"首頁"},{k:"t-grade",l:"批改個人作業",b:ungraded().length||""},{k:"t-groups",l:"小組報告評分"},...(PEER()?[{k:"t-peer",l:"互評結果"}]:[]),{k:"brief",l:"作業說明"},{k:"t-settings",l:"⚙ 系統設定"}];
    if(S.tab==="t-peer"&&!PEER()) S.tab="home";
    V={"t-settings":[viewTSettings,bindTSettings],brief:[viewBrief,bindBrief],home:[viewTHome,bindTHome],"t-grade":[viewTGrade,bindTGrade],"t-groups":[viewTGroups,bindTGroups],"t-peer":[viewTPeer,bindTPeer]};
  }else{
    const mem=groupMembers(u.group), miss=mem.filter(s=>essayStatus(s.id)!=="submitted").length;
    tabs=[{k:"home",l:"首頁"},{k:"essay",l:"我的作業",b:essayStatus(u.id)==="submitted"?"":"!"},...(PEER()?[{k:"peer",l:ownUploaded(u)?"幫各組評分":"幫各組評分 🔒",b:ownUploaded(u)&&peerDone(u.id)<7?7-peerDone(u.id):""}]:[])];
    if(u.leader){tabs.splice(3,0,{k:"upload",l:"上傳簡報",b:DB.pdfs[u.group]?"":"!"});if(PEER())tabs.push({k:"gsubmit",l:"送出小組評分",b:DB.finals[u.group]?"":"!"});tabs.push({k:"members",l:"組員狀況",b:miss||""})}
    else if(PEER()) tabs.push({k:"matrix",l:"全組評分彙整"});
    if(PEER()&&Object.keys(DB.history).length) tabs.push({k:"results",l:"互評結果"});
    if(!PEER()&&["peer","gsubmit","matrix"].includes(S.tab)) S.tab="home";
    V={brief:[viewBrief,bindBrief],home:[()=>viewHome()+'<div style="margin-top:28px">'+viewBrief({top:false})+"</div>",()=>{bindHome();bindBrief()}],essay:[viewEssay,bindEssay],peer:[viewPeer,bindPeer],matrix:[viewMatrix],gsubmit:[viewGroupSubmit,bindGroupSubmit],members:[viewMembers,bindMembers],upload:[viewUpload,bindUpload],results:[viewSResults,bindSResults]};
  }
  const [view,bind]=V[S.tab]||V.home;
  if(S.tab!=="essay") S.draft=null;
  if(S.tab!=="gsubmit") S.rk=null;
  app.innerHTML=shell(tabs,view());
  $("#logout").onclick=async()=>{if(S.leave&&S.leave()){const c=await dialog({title:"評分還沒儲存",body:"確定要登出嗎？還沒儲存的評分會不見。",buttons:[{l:"取消",v:false},{l:"登出",v:true,primary:true}]});if(!c)return}S={...S,user:null,token:null,tab:"home",sel:null,draft:null,leave:null};try{sessionStorage.removeItem("astmTok")}catch(e){}render();toast("已登出")};
  $$("[data-tab]").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
  $$("[data-z]").forEach(b=>b.onclick=()=>{const d=+b.dataset.z;let i=ZL.indexOf(ZOOM);if(i<0)i=1;i=d===0?1:Math.max(0,Math.min(ZL.length-1,i+d));ZOOM=ZL[i];try{localStorage.setItem("hwZoom",ZOOM)}catch(e){}render()});
  bind&&bind();
  window.scrollTo(0,0);
  bgRefresh();
}
setInterval(()=>{$$(".deadline").forEach(el=>{el.outerHTML=countdown()})},60000);
document.fonts?.ready?.then(()=>{if(S.user&&S.tab!=="essay")render()});
if(BACKEND){
  DB.students=[]; DB.settings.remindOn=true;
  $("#app").innerHTML='<div class="login-wrap"><div class="card" style="text-align:center"><b>載入中…</b></div></div>';
  let tok=null; try{tok=sessionStorage.getItem("astmTok")}catch(e){}
  // 老師專用連結：網址帶 ?k=金鑰，就直接以老師身分登入
  const urlKey=()=>new Promise(res=>{try{google.script.url.getLocation(l=>res(l&&l.parameter&&l.parameter.k||""))}catch(e){res("")}});
  urlKey().then(k=>!k?null:api("teacherKey",{key:k}).then(r=>{S.token=r.token;try{sessionStorage.setItem("astmTok",r.token)}catch(e){}applySnap(r.snapshot);S.user={teacher:true};S.tab="home";lastRefresh=Date.now();render();toast("已用老師專用連結登入");return true}).catch(e=>{toast("老師專用連結已失效，請用帳號密碼登入");return null}))
  .then(done=>{ if(done) return;
  (tok?(S.token=tok,api("refresh").then(r=>{applySnap(r.snapshot);S.user=r.user;S.tab="home";lastRefresh=Date.now();render()}).catch(()=>{S.token=null;return api("publicInfo").then(r=>{applySnap(r.snapshot);render()})}))
     :api("publicInfo").then(r=>{applySnap(r.snapshot);render()})).catch(e=>{$("#app").innerHTML=`<div class="login-wrap"><div class="card"><b>系統暫時無法使用</b><div class="muted">${esc(e.message)}</div></div></div>`});
  });
}else{
  // 展示版的老師示範連結：網址最後加 #teacher
  if(location.hash==="#teacher"&&CONFIG.demo){render();demoLogin("teacher");go("home")} else render();
}
</script>
