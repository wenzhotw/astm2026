<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTM 2026 課程作業繳交系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a2e; --muted:#5d6a6e; --line:#ddd6c8; --soft:#f7f3ea;
  --accent:#1f5f5b; --accent-soft:#e3efec; --warn:#b5462f; --warn-soft:#f8e4dc;
  --ok:#2f7a3d; --ok-soft:#e1f0e2; --gold:#b9862d; --gold-soft:#f6ecd6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:17px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.demo-bar{background:#2b2b2b;color:#f3e9d2;text-align:center;padding:6px 12px;font-size:14px}
#zoomRoot{min-height:100vh}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;font-weight:700}
header.top .who{color:var(--muted);font-size:15px}
.fs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fs button{border:none;background:var(--card);padding:6px 12px;cursor:pointer;min-height:40px;font-weight:700}
.fs button+button{border-left:1px solid var(--line)}
.fs button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 26px;font-size:19px}
.btn.small{padding:6px 12px;font-size:15px;min-height:36px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1280px;margin:0 auto;padding:20px 24px 120px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;border-bottom:2px solid var(--line)}
.tab{padding:10px 16px;border:none;background:none;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{display:inline-block;background:var(--warn);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;margin-left:6px;vertical-align:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.pill.draft{background:var(--gold-soft);color:#8a6420}
.pill.lead{background:var(--accent-soft);color:var(--accent)}
.pill.grey{background:#ece8df;color:var(--muted)}
h2{font-size:23px;margin:0 0 4px}
h3{font-size:18px;margin:0 0 8px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;background:var(--soft);font-size:15px}
td.num,th.num{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(31,42,46,.5);display:grid;place-items:center;z-index:70;padding:16px;overflow:auto}
.overlay .card{max-width:600px;width:100%;max-height:92vh;overflow:auto}
.overlay .card.wide{max-width:760px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.deadline{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--gold-soft);color:#7a5517;font-weight:500;font-size:15px}
.deadline.over{background:var(--warn-soft);color:var(--warn)}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head .sub{color:var(--muted)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}

/* login */
.login-wrap{min-height:calc(100vh - 34px);display:grid;place-items:center;padding:24px}
.login{width:min(440px,100%)}
.login h1{font-size:28px;margin:0 0 4px}
.field{display:block;margin:16px 0}
.field>span{display:block;font-weight:500;margin-bottom:6px}
.field input,.field textarea,.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}
.field input:focus,.field textarea:focus,.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.err{color:var(--warn);min-height:1.6em;font-weight:500}
.demo-accts{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px;font-size:15px}
.demo-accts button{width:100%;justify-content:flex-start;margin:6px 0}

/* home */
.tasks{display:grid;gap:14px}
.task{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:18px 20px}
.task .no{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;background:var(--accent-soft);color:var(--accent)}
.task.done .no{background:var(--ok-soft);color:var(--ok)}
.task.wait .no{background:#ece8df;color:var(--muted)}
.task .t{font-size:20px;font-weight:700}
.task .d{color:var(--muted)}
@media (max-width:640px){.task{grid-template-columns:44px 1fr}.task .no{width:40px;height:40px;font-size:17px}.task .act{grid-column:1/-1}.task .act .btn{width:100%}}

/* essay */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.editor textarea{min-height:480px;resize:vertical;line-height:1.8}
.counter{margin-top:8px}
.counter .info{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.counter.over .info{color:var(--warn);font-weight:700}
.counter.over .bar i{background:var(--warn)}
.counter.near .bar i{background:var(--gold)}
.saved{font-size:14px;color:var(--muted)}
.preview-col{position:sticky;top:84px}
.preview-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
.seg{display:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:none;background:var(--card);padding:10px;font-weight:700;min-height:44px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
@media (max-width:960px){
  .editor{grid-template-columns:1fr}.preview-col{position:static}.seg{display:flex}
  .editor[data-mv="edit"] .preview-col{display:none}.editor[data-mv="preview"] .edit-col{display:none}
}
.help{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:15px;margin-top:10px}
.help ul{margin:4px 0 0;padding-left:1.2em}
.pages{display:flex;flex-direction:column;gap:14px;align-items:center}
.page-shell{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden;position:relative;flex:none}
.page{width:794px;height:1123px;padding:76px;position:absolute;left:0;top:0;transform-origin:0 0;font-family:"Noto Serif TC","Noto Sans TC",serif;color:#000}
.page .clip{position:relative;overflow:hidden}
.page .flow{position:absolute;left:0;right:0}
.page .pno{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:14px;color:#666;font-family:"Noto Sans TC",sans-serif}
.flow .hd{}
.flow .hd .meta{display:flex;justify-content:center;gap:2.2em;font-family:"Noto Sans TC",sans-serif;font-weight:500;padding-top:8px}
.flow .hd .ttl{text-align:center;font-weight:700;border-bottom:2px solid #000;padding-bottom:8px}
.flow p{margin:0;text-indent:2em;text-align:justify;word-break:break-all}
.fit-warn{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-weight:500;margin-bottom:10px}
details.hist summary{cursor:pointer;font-weight:700;padding:6px 0;min-height:36px}

/* peer */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;cursor:pointer;min-height:44px;text-align:center;line-height:1.3}
.chip small{display:block;font-size:13px;color:var(--muted)}
.chip.done{border-color:var(--ok-soft);background:var(--ok-soft)}
.chip.done small{color:var(--ok);font-weight:700}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:960px){.viewer{grid-template-columns:1fr}.viewer .panel{position:static!important}}
.slides{display:flex;flex-direction:column;gap:14px}
.slide{aspect-ratio:16/9;border-radius:6px;padding:7%;display:flex;flex-direction:column;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.slide .k{font-size:clamp(12px,1.6vw,16px);opacity:.8}
.slide .h{font-size:clamp(20px,3.4vw,40px);font-weight:700;line-height:1.25;margin:6px 0}
.slide ul{font-size:clamp(14px,1.9vw,22px);margin:10px 0 0;padding-left:1.2em}
.slides canvas{width:100%;height:auto;box-shadow:0 2px 8px rgba(0,0,0,.12);border-radius:4px;background:#fff}
.scorebox{display:flex;align-items:center;gap:8px;margin:8px 0}
.scorebox input{width:120px;font-size:34px;font-weight:700;text-align:center;padding:6px;border:2px solid var(--line);border-radius:12px}
.scorebox input:focus{outline:none;border-color:var(--accent)}
.scorebox .btn{min-width:60px;font-weight:700}
textarea.cmt{width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical;background:#fff}

/* matrix & ranking */
.matrix td.num input{width:80px;text-align:center;padding:6px;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:6px}
.matrix tr.avg td{background:var(--soft);font-weight:700}
.matrix tr.final td{background:var(--accent-soft);font-weight:700}
.mine td{background:#fffbe9}
.cell-empty{color:#bbb}
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-item .rc{grid-column:1/-1;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.rank-item .rc textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;resize:vertical;font-size:16px}
.rank-item .mc{grid-column:1/-1;font-size:14px;color:var(--muted)}
.rank-item .mc summary{cursor:pointer}
@media (max-width:640px){.rank-item .rc{grid-template-columns:1fr}.rank-item .rc .lbl{display:none}}
.rank-item{display:grid;grid-template-columns:36px 84px 1fr auto auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rank-item.dragging{opacity:.4}
.rank-item.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rank-item.conflict{border-color:var(--gold);background:#fffaf0}
.handle{cursor:grab;color:var(--muted);font-size:22px;text-align:center;user-select:none}
.rk{font-weight:700;font-size:20px;color:var(--accent)}
.rank-item input{width:90px;font-size:22px;font-weight:700;text-align:center;padding:6px;border:1px solid var(--line);border-radius:8px}
.arrows{display:flex;gap:4px}
.arrows .btn{min-width:44px;padding:6px}
@media (max-width:640px){.rank-item{grid-template-columns:28px 64px 1fr;}.rank-item .sc,.rank-item .arrows{grid-column:span 1}.rank-item .sc{grid-column:2/4}.rank-item .arrows{grid-column:1/-1;justify-content:flex-end}}

/* teacher */
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.dash .card .n{font-size:34px;font-weight:700;line-height:1.2}
.dash .card .n small{font-size:18px;color:var(--muted);font-weight:500}
.namechips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.namechips span{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:15px}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.split{grid-template-columns:1fr}}
.list-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list-item:hover{background:var(--soft)}
.list-item.on{background:var(--accent-soft)}
.scroll{max-height:72vh;overflow:auto}
.gradebar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--accent);z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.gradebar .in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.gradebar input.sc{width:100px;font-size:26px;font-weight:700;text-align:center;padding:6px;border:2px solid var(--line);border-radius:10px}
.gradebar input.cm{flex:1;min-width:200px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px}
details.menu{position:relative;display:inline-block}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .items{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;min-width:280px;z-index:25}
details.menu .items button{width:100%;justify-content:flex-start;border:none;background:none}
details.menu .items button:hover{background:var(--soft)}
details.menu .items label{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:15px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.upload{border:2px dashed var(--line);border-radius:14px;padding:32px;text-align:center;background:#fff;cursor:pointer;display:block}
.upload.drag{border-color:var(--accent);background:var(--accent-soft)}
.note{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:15px;color:#6b4e16;margin-bottom:16px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.msgbox{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:640px){main{padding:14px 12px 120px}header.top{padding:10px 12px}header.top h1{font-size:17px}.card{padding:16px}}

/* 作業說明 */
.bw{display:grid;grid-template-columns:210px minmax(0,1fr);gap:36px;align-items:start;max-width:1080px;margin:0 auto}
.toc{position:sticky;top:96px;display:flex;flex-direction:column;gap:2px;font-size:16px}
.toc .tt{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin:0 0 6px 12px}
.toc a{display:block;padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;border-left:3px solid transparent;line-height:1.4}
.toc a:hover{background:var(--soft);color:var(--ink)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:700}
.toc a.sub{padding-left:26px;font-size:15px}
.brief{font-size:19px;line-height:1.9;max-width:760px}
.brief section{scroll-margin-top:96px}
.brief .eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.brief h1{font-size:30px;line-height:1.35;margin:0 0 6px}
.brief h2{font-size:25px;line-height:1.4;margin:0 0 14px;display:flex;align-items:center;gap:12px}
.brief h2 .tag{font-size:14px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--accent);color:#fff;line-height:1.6}
.brief h2 .tag.g{background:#7a3b2e}
.brief h3{font-size:21px;line-height:1.45;margin:0 0 6px}
.brief p{margin:0 0 14px}
.brief .lead{font-size:17px;color:var(--muted);margin:0}
.brief section+section{margin-top:52px}
.brief mark{background:linear-gradient(transparent 58%,#f3dfa9 58%);color:inherit;padding:0 2px;font-weight:700}
/* 時間軸 */
.tl{display:flex;align-items:flex-start;margin:22px 0 6px;position:relative}
.tl:before{content:"";position:absolute;left:8%;right:8%;top:13px;height:3px;background:var(--line)}
.tl .st{flex:1;text-align:center;position:relative;font-size:15px;line-height:1.5;color:var(--muted)}
.tl .st i{display:block;width:18px;height:18px;border-radius:50%;background:var(--line);margin:4px auto 8px;border:3px solid var(--bg)}
.tl .st b{display:block;color:var(--ink);font-size:16px}
.tl .st.now i{background:var(--accent)}
.tl .st.due i{background:var(--warn);width:24px;height:24px;margin-top:1px}
.tl .st.due b{color:var(--warn)}
/* 繳交清單 */
.check{display:grid;gap:12px;margin-top:18px}
.check .it{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.check .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--accent-soft)}
.check .it.g .ic{background:#f5e6e2}
.check .nm{font-size:20px;font-weight:700;line-height:1.4}
.check .ds{font-size:16px;color:var(--muted);line-height:1.6}
@media (max-width:640px){.check .it{grid-template-columns:44px 1fr}.check .it .btn{grid-column:1/-1}}
/* 老師的話 */
.letter{background:#fff;border-radius:16px;padding:26px 30px;position:relative;border:1px solid var(--line)}
.letter:before{content:"“";position:absolute;left:18px;top:-6px;font-size:72px;color:var(--accent);opacity:.25;font-family:Georgia,serif;line-height:1}
.letter p:last-child{margin-bottom:0}
.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.abc div{background:var(--accent-soft);border-radius:12px;padding:10px;text-align:center;line-height:1.35}
.abc b{display:block;font-size:26px;color:var(--accent)}
.abc span{font-size:14px;color:var(--muted)}
/* 規格列 */
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 18px}
.specs div{background:#fff;padding:10px 14px;line-height:1.4}
.specs span{display:block;font-size:13px;color:var(--muted)}
.specs b{font-size:17px}
/* 報告結構 */
.struct{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:16px 0 8px}
.struct a{display:block;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;line-height:1.45;transition:border-color .15s}
.struct a:hover{border-color:var(--accent)}
.struct a.main{border-color:var(--accent)}
.struct .k{font-size:13px;font-weight:700;color:var(--accent)}
.struct .t{font-size:18px;font-weight:700;margin:2px 0}
.struct .p{font-size:15px;color:var(--muted)}
.struct .bar{height:8px;background:var(--accent-soft);border-radius:4px;margin-top:10px;overflow:hidden}
.struct .bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:640px){.struct{grid-template-columns:1fr}}
/* 案例卡 */
.case{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-top:22px}
.case .no{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:#7a3b2e;border-radius:8px;padding:1px 10px;margin-bottom:8px}
.qs{list-style:none;padding:0;margin:16px 0 0;counter-reset:none}
.qs li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.qs li .n{font-weight:700;color:var(--accent);font-size:17px;padding-top:2px}
.qs li .tx div+div{margin-top:4px}
.qs li .note2{margin-top:10px;background:var(--gold-soft);color:#6b4e16;border-radius:10px;padding:10px 14px;font-size:16px;line-height:1.7}
.scale{display:inline-flex;gap:4px;margin-left:8px;vertical-align:2px}
.scale i{font-style:normal;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);background:#fff}
.scale i:last-child{border-color:var(--accent);color:var(--accent);font-weight:700}
.hint{background:var(--soft);border-radius:12px;padding:14px 18px;font-size:17px;line-height:1.8;margin:18px 0 4px}
.refs{margin:14px 0 0}
.refs .rt{font-size:15px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.refs a{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;text-decoration:none;color:var(--ink);font-size:16px;line-height:1.55}
.refs a:hover{border-color:var(--accent)}
.refs a .ar{margin-left:auto;color:var(--accent);flex:none}
.refs a small{display:block;color:var(--muted);font-size:13px}
.closing{text-align:center;font-size:21px;font-weight:700;color:var(--accent);padding:30px 10px 10px;line-height:1.6}
.totop{position:fixed;right:20px;bottom:24px;z-index:25;width:52px;height:52px;border-radius:50%;padding:0;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
@media (max-width:960px){
  .bw{grid-template-columns:1fr;gap:0}
  .toc{position:sticky;top:0;z-index:15;flex-direction:row;overflow-x:auto;background:var(--bg);padding:8px 0;margin:0 -12px 8px;padding-left:12px;gap:6px;scrollbar-width:none}
  .toc .tt,.toc a.sub{display:none}
  .toc a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:6px 14px}
  .toc a.on{border-color:var(--accent)}
  .brief{font-size:18px;max-width:none}
  .brief h1{font-size:26px}
  .case{padding:18px}
  .letter{padding:22px 20px}
  .qs li{grid-template-columns:44px 1fr}
}
.hw-banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px 18px;margin-bottom:16px}

@media (max-width:640px){
  header.top{position:static;gap:8px}
  header.top .who{font-size:14px}
  .fs button{padding:4px 10px;min-height:38px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:8px 12px}
  .brief h1{font-size:23px}
  .brief section,.case{scroll-margin-top:70px!important}
  .totop{width:46px;height:46px;right:14px;bottom:16px}
}

/* 大倒數 */
.cdh{border-radius:22px;padding:26px 24px 22px;text-align:center;color:#fff;background:linear-gradient(135deg,#1f5f5b,#163f3c);box-shadow:0 10px 30px rgba(31,95,91,.25);margin-bottom:22px}
.cdh.warn{background:linear-gradient(135deg,#b9862d,#8a5f17);box-shadow:0 10px 30px rgba(185,134,45,.3)}
.cdh.hot{background:linear-gradient(135deg,#c2452c,#8e2a1a);box-shadow:0 10px 30px rgba(181,70,47,.35)}
.cdh.over{background:linear-gradient(135deg,#5d6a6e,#3a4447)}
.cdh .lb{font-size:18px;font-weight:700;letter-spacing:.06em;opacity:.92}
.cd{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:12px 0 10px}
.cd>div{min-width:104px;background:rgba(255,255,255,.13);border-radius:16px;padding:10px 8px 8px}
.cd b{display:block;font-size:68px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cd span{display:block;font-size:16px;opacity:.85;margin-top:6px}
.cd i{font-style:normal;font-size:52px;line-height:1.3;opacity:.5}
.cdh.hot .cd>div:last-child b{animation:tick 1s ease-in-out infinite}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.55}}
.cdh .due{font-size:15px;opacity:.85}
.cdh .msg{display:inline-block;margin-top:10px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;font-size:15px;font-weight:700}
@media (max-width:640px){.cd{gap:6px}.cd>div{min-width:0;flex:1;padding:8px 4px 6px}.cd b{font-size:42px}.cd i{display:none}.cd span{font-size:14px}.cdh{padding:20px 14px 18px}.cdh .lb{font-size:16px}}
/* 公開首頁 */
.pub-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pub-actions .card{display:flex;flex-direction:column;gap:6px}
.pub-actions .card .t{font-size:21px;font-weight:700}
.pub-actions .card .d{color:var(--muted);flex:1}
.loginbox{max-width:440px}

"在這學期的課程中，我最大的收穫是學會從不同角度看待同一個問題。過去我習慣只從自己的經驗出發，認為只要努力就能解決大部分的困難，但透過小組討論與課堂案例，我發現許多問題背後都有制度、文化與資源分配的因素。",

function cdParts(){const ms=Math.max(0,DB.settings.deadline-Date.now());return {ms,d:Math.floor(ms/864e5),h:Math.floor(ms%864e5/36e5),m:Math.floor(ms%36e5/6e4),s:Math.floor(ms%6e4/1e3)}}

/* ================= 後端連線（Google Apps Script） ================= */
// 放在 Apps Script 裡執行時，google.script.run 存在 → 正式模式，資料存在試算表。
// 直接用瀏覽器打開 index.html 時不存在 → 展示模式，資料只在記憶體。
const BACKEND=!!(window.google&&google.script&&google.script.run);
function api(fn,payload){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(r=>{
      if(r&&r.error){ if(r.expired){S.token=null;try{sessionStorage.removeItem("astmTok")}catch(e){}} rej(new Error(r.error)); }
      else res(r||{});
    }).withFailureHandler(e=>rej(new Error((e&&e.message)||"連線失敗，請稍後再試"))).api(fn,S.token||null,payload||{});
  });
}
// 呼叫後端；回傳有 snapshot 就更新本機資料
async function call(fn,payload,{busyMsg,quiet}={}){
  if(busyMsg) busy(busyMsg);
  try{const r=await api(fn,payload); if(r.snapshot) applySnap(r.snapshot); return r}
  catch(e){ if(!quiet) await dialog({title:"沒有成功",body:esc(e.message),buttons:[{l:"知道了",v:1,primary:true}]}); throw e }
  finally{ if(busyMsg) busy() }
}
function applySnap(sn){
  if(sn.students){DB.students=sn.students}
  for(const k of ["versions","drafts","pdfs","peer","finals","tEssay","tGroup"]) if(sn[k]) DB[k]=sn[k];
  if(sn.settings) Object.assign(DB.settings,sn.settings);
  if(sn.brief) BRIEF=sn.brief;
  DB.essays={}; DB.students.forEach(x=>syncEssay(x.id));
}
const blobToB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
const b64ToBlob=(b64,type="application/pdf")=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
// 小組報告 PDF：正式模式從雲端硬碟抓，抓過就快取
const PDFCACHE={};
async function reportBlob(g){
  const p=DB.pdfs[g]; if(!p) return null;
  if(p.blob) return p.blob;
  if(!BACKEND) return null;
  const key=g+"@"+p.at;
  if(!PDFCACHE[key]) PDFCACHE[key]=api("getReport",{g}).then(r=>b64ToBlob(r.data));
  return PDFCACHE[key];
}
// 背景重新抓資料：切換分頁時呼叫，資料有變才重畫
let refreshing=false, lastRefresh=0;
function bgRefresh(){

/* ================= A4 排版引擎（13.5～14pt、兩倍行高） ================= */
const PAGE={w:794,h:1123,m:76}, FS_MAX=14, FS_MIN=13.5, FS_STEP=0.25, LINE=2, PGAP=0.5; // 字級 14→13.5pt 自動調整、兩倍行高、段落間距半行
let measurer;
function flowHTML(stu,essay,lh,fs){
  const px=fs*96/72, gap=Math.round(lh*PGAP);
  const paras=(essay.text||"").split(/\n/).filter(p=>p.trim()!=="").map((p,i)=>`<p style="${i?`margin-top:${gap}px`:""}">${esc(p)}</p>`).join("");
  return `<div class="flow" style="font-size:${px}px;line-height:${lh}px;width:${PAGE.w-2*PAGE.m}px">
    <div class="hd" data-hd style="font-size:${px*0.95}px;line-height:1.7;padding-bottom:10px;margin-bottom:${Math.round(lh*0.6)}px">
      <div class="ttl" style="font-size:${px*1.2}px">${esc(essay.title||"（未填寫題目）")}</div>
      <div class="meta"><span>${esc(showId(stu))}</span><span>第 ${stu.group} 組</span><span>${esc(stu.name)}</span></div>
    </div><div>${paras}</div></div>`;
}
// 依實際每一行的位置分頁，確保不會把一行字切成兩半
function layout(stu,essay){
  let L; for(let fs=FS_MAX;fs>=FS_MIN-1e-6;fs-=FS_STEP){L=layoutAt(stu,essay,fs);if(L.fits)break} return L;
}
function layoutAt(stu,essay,fs){
  if(!measurer){measurer=document.createElement("div");measurer.style.cssText="position:absolute;left:-99999px;top:0;visibility:hidden";measurer.className="page";document.body.appendChild(measurer)}
  const lh=Math.round(fs*96/72*LINE), avail=PAGE.h-2*PAGE.m; // 頁碼放在下邊界內，不佔內文空間
  measurer.innerHTML=flowHTML(stu,essay,lh,fs);
  const flow=measurer.querySelector(".flow"), base=flow.getBoundingClientRect().top, hd=flow.querySelector("[data-hd]");
  const units=[{t:0,b:hd.getBoundingClientRect().bottom-base}];
  flow.querySelectorAll("p").forEach(p=>{
    const r=document.createRange(); r.selectNodeContents(p);
    const tops=new Map(); [...r.getClientRects()].forEach(x=>{const t=Math.round(x.top-base);if(!tops.has(t))tops.set(t,t)});
    const pr=p.getBoundingClientRect(), pt=pr.top-base, n=Math.max(1,Math.round(pr.height/lh));
    for(let k=0;k<n;k++) units.push({t:pt+k*lh,b:pt+(k+1)*lh});
  });
  const starts=[0], heights=[]; let st=0, last=0;
  units.forEach(u=>{ if(u.b-st>avail){heights.push(last-st);st=u.t;starts.push(st)} last=u.b; });
  heights.push(last-st);
  return {fs,lh,starts,heights,pages:starts.length,fits:starts.length<=2,total:last};
}
function renderPages(container,stu,essay,width){
  const L=layout(stu,essay), scale=width/PAGE.w, shown=Math.min(2,L.pages);
  let html="";
  for(let i=0;i<shown;i++){
    html+=`<div class="page-shell" style="width:${PAGE.w*scale}px;height:${PAGE.h*scale}px"><div class="page" style="transform:scale(${scale})">
      <div class="clip" style="height:${L.heights[i]}px">${flowHTML(stu,essay,L.lh,L.fs).replace('class="flow" style="','class="flow" style="top:'+(-L.starts[i])+'px;')}</div>
      <div class="pno">第 ${i+1} 頁，共 ${shown} 頁${essay.v?`｜v${essay.v}｜${fmtTime(essay.at)} 繳交`:""}</div></div></div>`;
  }
  container.innerHTML=html;
  return L;
}

const pdfName=(s,v)=>`第${s.group}組_${s.name}_${s.id}${v?`_v${v}`:""}.pdf`;
let pdfHost;
async function addEssayPages(doc,stu,essay,first){
  if(!pdfHost){pdfHost=document.createElement("div");pdfHost.style.cssText="position:fixed;left:-10000px;top:0;width:794px";document.body.appendChild(pdfHost)}
  renderPages(pdfHost,stu,essay,PAGE.w);

  for(let i=0;i<pages.length;i++){
    const cv=await html2canvas(pages[i],{scale:1.7,backgroundColor:"#ffffff",logging:false});
    if(!(first&&i===0)) doc.addPage("a4","portrait");
    doc.addImage(cv.toDataURL("image/jpeg",0.82),"JPEG",0,0,210,297);
  }
  pdfHost.innerHTML="";
}
const newDoc=()=>new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
async function essayBlob(stu,essay){const d=newDoc();await addEssayPages(d,stu,essay,true);return d.output("blob")}
async function saveFile(filename,blob){
  try{const dl=window.claude?await window.claude.use("downloads"):null; if(dl){await dl.save({filename,data:blob});return true}}
  catch(e){
    if(e&&e.code==="declined"){toast("已取消下載");return false}
    if(!(e&&["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code))){toast("下載失敗，請再試一次");return false}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}

function cleanPaste(t){
  let n=0; t=t.replace(/\r\n?/g,"\n");
  const out=[];
  for(const line of t.split("\n")){
    let c=line.replace(/^[\s　 ]+|[\s　 ]+$/g,""); if(c!==line) n++;
    c=c.replace(/[ \t 　]{2,}/g,()=>{n++;return " "});
    if(c==="") {n++;continue}
    out.push(c);
  }
  return {text:out.join("\n"),n:Math.max(0,n)};
}

  if(!ok) return;
  let mailed=true, email=emailOf(u);
  if(BACKEND){

    try{busy("正在產生 PDF…"); blob=await essayBlob(u,{title:d.title,text:d.text,at:Date.now(),v,status:"submitted"})}catch(err){busy();toast("產生 PDF 失敗");return}

      <div style="margin-top:6px">${esc(u.name)} 同學你好：系統已收到你的個人作業（第 ${v} 版），繳交時間 ${fmtTime(e.at)}，共 ${countChars(e.text)} 字。排版好的 PDF 附在這封信裡。需要修改的話，可以再登入系統重新繳交，老師會以最新版本為準。</div>
      <div style="margin-top:8px;padding:6px 10px;background:var(--soft);border-radius:8px">📎 ${esc(file)}</div></div></details>`}`,
    buttons:[{l:"再下載一次 PDF",v:"dl"},{l:"回首頁",v:"home",primary:true}]});

}

function sampleSlides(g){
  const c=SLIDE_COLORS[g-1], t=TOPICS[g-1]||`第 ${g} 組期末簡報`, mem=groupMembers(g).map(s=>s.name).join("、");
  return `<div class="slides">

    <div class="slide" style="background:${c}"><div class="k">研究動機</div><div class="h">為什麼關心這個題目？</div><ul><li>問題現況與數據</li><li>受影響的族群</li><li>現有做法的不足</li></ul></div>
    <div class="slide" style="background:${c}"><div class="k">提案</div><div class="h">我們的解決方案</div><ul><li>具體做法與執行步驟</li><li>預期效益</li><li>可能遇到的困難</li></ul></div>
  </div><div class="muted" style="font-size:14px;margin-top:8px">（展示用示意簡報，正式版會顯示各組上傳的 PDF）</div>`;
}
async function renderPdfInto(el,url){
  el.innerHTML='<div class="muted">簡報載入中…</div>';
  try{ if(!url){const b=await reportBlob(+el.dataset.pdf); if(!b) throw 0; url=URL.createObjectURL(b)}
    const lib=window.pdfjsLib;if(!lib)throw 0;lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await lib.getDocument(url).promise; el.innerHTML='<div class="slides"></div>'; const box=el.firstChild;
    for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),vp=p.getViewport({scale:1.6}),cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;box.appendChild(cv);await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise}
  }catch(e){el.innerHTML='<div class="fit-warn">簡報無法顯示，請確認檔案是 PDF</div>'}
}
function slidesHTML(g){
  const p=DB.pdfs[g];
  if(!p) return `<div class="card empty"><b>第 ${g} 組還沒上傳簡報</b>組長上傳後，這裡就會顯示簡報。</div>`;
  return p.kind==="sample"?sampleSlides(g):`<div data-pdf="${g}"></div>`;
}
const mountPdfs=()=>$$("[data-pdf]").forEach(el=>renderPdfInto(el,DB.pdfs[el.dataset.pdf].url));

function bindPeer(){
  const u=S.user, mine=()=>DB.peer[u.id]||{};
  if(!ownUploaded(u)){$$("[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go));return}
  const g=S.sel||ALLG.find(x=>!mine()[x]&&DB.pdfs[x])||1, idx=ALLG.indexOf(g);
  $$("[data-pg]").forEach(b=>b.onclick=()=>nav("peer",+b.dataset.pg));

  const sc=$("#sc"); if(!sc){const sk=$("#skipG");if(sk)sk.onclick=()=>nav("peer",ALLG[idx+1]);return}

}

  const scores={}; ALLG.forEach(t=>{const a=avgFor(g,t);scores[t]=a!=null?Math.round(a):""});
  S.rk={order:[...ALLG].sort((a,b)=>(scores[b]===""?-1:scores[b])-(scores[a]===""?-1:scores[a])||a-b),scores,comments:{},overall:""};
}
function viewGroupSubmit(){

  <div class="muted" style="font-size:15px;margin-bottom:10px">按住左邊的 ⠿ 上下拖曳，或用 ↑ ↓ 調整順序。分數預設是組內平均，每組都可以寫評語，點「組員評語」可以參考組員寫了什麼。</div>

function rankConflicts(){const {order,scores}=S.rk;const c=new Set();order.forEach((a,i)=>order.slice(i+1).forEach(b=>{if(scores[a]!==""&&scores[b]!==""&&+scores[b]>+scores[a]){c.add(a);c.add(b)}}));return c}
// 只更新黃色標示和提示文字，不重畫輸入框（避免打字時失去焦點）
function updateRankMeta(){
  const {scores}=S.rk, conflict=rankConflicts();
  $$(".rank-item").forEach(el=>el.classList.toggle("conflict",conflict.has(+el.dataset.ri)));
  const missing=ALLG.filter(t=>scores[t]===""||+scores[t]<0||+scores[t]>100);
  $("#rankMsg").innerHTML=missing.length?`<span style="color:var(--warn);font-weight:500">還有 ${missing.length} 組沒填分數（0 到 100）</span>`:conflict.size?`<span style="color:#8a6420;font-weight:500">黃色的組別：分數高的排在分數低的後面。如果是刻意的，仍然可以送出。</span>`:`<span style="color:var(--ok);font-weight:500">✓ 分數和名次都沒問題</span>`;
}
function renderRank(){
  const {order,scores}=S.rk;
  const conflict=rankConflicts();
  $("#rankList").innerHTML=order.map((t,i)=>`<div class="rank-item ${conflict.has(t)?"conflict":""}" data-ri="${t}">
    <div class="handle" title="拖曳">⠿</div><div class="rk">第 ${i+1} 名</div>
    <div><b>第 ${t} 組</b>${t===S.user.group?' <span class="muted">（本組）</span>':""}<div class="muted" style="font-size:14px">組內平均 ${avgFor(S.user.group,t)??"—"}${DB.pdfs[t]?"":' <span class="pill no">未上傳簡報</span>'}</div></div>
    <div class="sc row" style="gap:6px"><input type="number" inputmode="numeric" min="0" max="100" data-rs="${t}" value="${scores[t]}" placeholder="分數"><span class="muted">分</span></div>
    <div class="arrows"><button class="btn" data-mv-up="${t}" ${i===0?"disabled":""} aria-label="往上">↑</button><button class="btn" data-mv-dn="${t}" ${i===6?"disabled":""} aria-label="往下">↓</button></div>
    <div class="rc"><span class="lbl muted" style="padding-top:8px;text-align:right">評語</span><textarea data-rcm="${t}" rows="1" placeholder="給第 ${t} 組的評語（選填）">${esc(S.rk.comments[t]||"")}</textarea></div>
    ${(()=>{const mc=groupMembers(S.user.group).map(m=>({n:m.name,c:DB.peer[m.id]?.[t]?.comment})).filter(x=>x.c);return mc.length?`<details class="mc"><summary>組員評語（${mc.length}）</summary>${mc.map(x=>`<div>・${esc(x.n)}：${esc(x.c)}</div>`).join("")}</details>`:""})()}
    </div>`).join("");
  updateRankMeta();
  bindRank();
}
function moveRank(t,delta){const o=S.rk.order,i=o.indexOf(t),j=i+delta;if(j<0||j>6)return;[o[i],o[j]]=[o[j],o[i]];renderRank();$(`[data-ri="${t}"] input`)?.focus()}
function bindRank(){
  $$("[data-rcm]").forEach(i=>i.oninput=()=>{S.rk.comments[i.dataset.rcm]=i.value});
  $$(".rank-item .handle").forEach(h=>{const it=h.closest(".rank-item");h.onmousedown=h.ontouchstart=()=>{it.draggable=true}});
  $$("[data-rs]").forEach(i=>{i.oninput=()=>{S.rk.scores[i.dataset.rs]=i.value===""?"":Math.round(+i.value);updateRankMeta()}});
  $$("[data-mv-up]").forEach(b=>b.onclick=()=>moveRank(+b.dataset.mvUp,-1));
  $$("[data-mv-dn]").forEach(b=>b.onclick=()=>moveRank(+b.dataset.mvDn,1));
  let drag=null;
  $$(".rank-item").forEach(el=>{
    el.ondragstart=e=>{drag=+el.dataset.ri;el.classList.add("dragging");e.dataTransfer.effectAllowed="move"};
    el.ondragend=()=>{el.draggable=false;el.classList.remove("dragging");$$(".rank-item").forEach(x=>x.classList.remove("over"))};
    el.ondragover=e=>{e.preventDefault();el.classList.add("over")};
    el.ondragleave=()=>el.classList.remove("over");
    el.ondrop=e=>{e.preventDefault();const to=+el.dataset.ri;if(drag==null||drag===to)return;const o=S.rk.order,ti=o.indexOf(to);o.splice(o.indexOf(drag),1);o.splice(ti,0,drag);renderRank()};
  });
}
function bindGroupSubmit(){
  if(!ownUploaded(S.user)){$$("[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go));return}
  renderRank();
  $("#overall").oninput=e=>{S.rk.overall=e.target.value};
  $("#autoRank").onclick=()=>{const s=S.rk.scores;if(ALLG.some(t=>s[t]==="")){toast("請先把七組的分數都填好");return}
    S.rk.order.sort((a,b)=>s[b]-s[a]);renderRank();toast("已依分數排好，同分的請自己調整先後")};
  $("#submitFinal").onclick=async()=>{

function qItem(n,t){
  let note=""; const m=t.match(/（提醒：([\s\S]*)）$/); if(m){note=m[1];t=t.slice(0,m.index)}
  let sc=""; const sm=t.match(/（1 ?到 ?5 ?分[^）]*）/); if(sm){t=t.replace(sm[0],"");sc=`<span class="scale" title="${esc(sm[0])}">${[1,2,3,4,5].map(x=>`<i>${x}</i>`).join("")}</span><span class="muted" style="font-size:14px;margin-left:6px">5 分是完美</span>`}
  const parts=[]; t.split(/(?<=？)/).map(x=>x.trim()).filter(Boolean).forEach(x=>{if(parts.length&&(x.length<=8||parts[parts.length-1].length<=8))parts[parts.length-1]+=x;else parts.push(x)});
  return `<li><span class="n">${esc(n)}</span><div class="tx">${parts.map(x=>`<div>${md(x)}</div>`).join("")}${sc}${note?`<div class="note2">💡 提醒：${md(note)}</div>`:""}</div></li>`;
}
const parseQs=t=>(t||"").split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d+(?:\.\d+)*)\s+([\s\S]+)$/);return m?[m[1],m[2]]:["・",x]});
const qList=t=>{const q=parseQs(t);return q.length?`<ol class="qs">${q.map(([n,x])=>qItem(n,x)).join("")}</ol>`:""};
function refsHTML(t){
  let html="", k=0;
  (t||"").split("\n").map(x=>x.trim()).filter(Boolean).forEach(line=>{
    if(line.startsWith("##")){html+=`<div class="rt">${esc(line.replace(/^#+\s*/,""))}</div>`;k=0;return}
    const parts=line.split("|").map(x=>x.trim()), url=parts[parts.length-1], title=parts[0], src=parts.length>2?parts[1]:"";
    k++; let host=""; try{host=new URL(url).hostname.replace(/^www\./,"")}catch(e){html+=`<div class="refs-bad">${esc(line)}</div>`;return}
    html+=`<a href="${esc(url)}" target="_blank" rel="noopener"><span>📎</span><span>${esc(title)}${src?`<span class="muted">（${esc(src)}）</span>`:""}<small>補充資料-${k}｜${esc(host)}</small></span><span class="ar">↗</span></a>`;
  });
  return html?`<div class="refs">${html}</div>`:"";
}

function bindUpload(){
  $$("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();nav(b.dataset.go)});
  const take=async f=>{if(!f)return;if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){toast("只能上傳 PDF 檔");return}
    if(f.size>20*1024*1024){toast("檔案超過 20 MB，請先壓縮");return}
    const old=DB.pdfs[S.user.group];if(old?.url)URL.revokeObjectURL(old.url);
    const first=!old, url=URL.createObjectURL(f);
    busy("正在檢查 PDF…");
    let pages=null; try{const lib=window.pdfjsLib;if(lib){lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";pages=(await lib.getDocument(url).promise).numPages}}catch(e){}
    busy();
    if(BACKEND){ try{ await call("uploadReport",{data:await blobToB64(f),orig:f.name,pages},{busyMsg:"正在上傳，請不要關閉頁面…"}) }catch(err){ return }
      const p=DB.pdfs[S.user.group]; if(p){p.blob=f;p.url=url} }
    else DB.pdfs[S.user.group]={kind:"pdf",name:`第${S.user.group}組_簡報.pdf`,orig:f.name,blob:f,url,pages,at:Date.now()};
    toast(pages>maxPages()?`已上傳，但有 ${pages} 頁，超過 ${maxPages()} 頁上限`:first&&PEER()?"簡報已上傳，全組現在可以開始評分了":first?"小組報告已上傳":"小組報告已更新");render()};
  $("#pdfIn").onchange=e=>take(e.target.files[0]);
  const d=$("#drop");d.ondragover=e=>{e.preventDefault();d.classList.add("drag")};d.ondragleave=()=>d.classList.remove("drag");d.ondrop=e=>{e.preventDefault();d.classList.remove("drag");take(e.dataTransfer.files[0])};
  mountPdfs();
}

    <div>${!e?`<div class="card empty"><b>目前沒有作業</b></div>`:`
      <div class="card" style="margin-bottom:16px">
        <div class="row"><h3 style="margin:0;font-size:20px">第${stu.group}組 ${esc(stu.name)}｜${esc(e.title)}</h3><span class="spacer"></span>${statusPill(sel)}<span class="muted">${countChars(e.text)} 字</span><button class="btn small" id="tdl">下載這份</button></div>
        ${nv>1?`<div class="row" style="margin-top:10px;gap:8px"><span class="muted">版本：</span>${Array.from({length:nv},(_,i)=>i+1).map(v=>`<button class="btn small ${(ver||nv)===v?"primary":""}" data-ver="${v}">v${v}${v===nv?"（最新）":""}｜${fmtTime(DB.versions[sel][v-1].at)}</button>`).join("")}</div>`:""}
        ${e.status==="draft"?'<div class="note" style="margin:10px 0 0">這位同學還沒按繳交，下面是草稿。</div>':""}
      </div>
      <div class="pages" id="tpages"></div>`}</div>
  </div>
  ${e?`<div class="gradebar"><div class="in">
    <button class="btn" id="gPrev" ${pos<=0?"disabled":""}>← 上一份</button>
    <b>第${stu.group}組 ${esc(stu.name)}</b>
    <input class="sc" id="tsc" type="number" inputmode="numeric" min="0" max="100" value="${ts?.score??""}" placeholder="分數">
    <input class="cm" id="tcm" value="${esc(ts?.comment||"")}" placeholder="評語（選填）">
    <button class="btn primary big" id="gNext">儲存，下一份 →</button>
  </div></div>`:""}`;
}
function bindTGrade(){
  bindDownloadMenu();
  $$("[data-tf]").forEach(b=>b.onclick=()=>{S.tFilter=b.dataset.tf;S.ver=null;go("t-grade",null)});
  $$("[data-sid]").forEach(el=>el.onclick=()=>{S.ver=null;go("t-grade",el.dataset.sid)});
  $$("[data-ver]").forEach(el=>el.onclick=()=>{S.ver=+el.dataset.ver;go("t-grade",S.sel)});
  const sel=S.sel; if(!sel||!DB.essays[sel]) return;
  const nv=DB.versions[sel]?.length||0, ver=S.ver&&S.ver<=nv?S.ver:null, e=ver?essayVer(sel,ver):DB.essays[sel];
  const pc=$("#tpages"); renderPages(pc,byId(sel),e,Math.min(pc.clientWidth||760,820));
  $("#tdl").onclick=()=>downloadOne(sel,ver||undefined);
  const list=gradeList(), pos=list.findIndex(s=>s.id===sel);
  $("#gPrev").onclick=()=>{S.ver=null;go("t-grade",list[pos-1].id)};
  const saveNext=()=>{
    const v=$("#tsc").value;
    if(v!==""){if(+v<0||+v>100){toast("分數要在 0 到 100 之間");return}DB.tEssay[sel]={score:Math.round(+v),comment:$("#tcm").value.trim()};if(BACKEND)api("gradeEssay",{id:sel,...DB.tEssay[sel]}).catch(err=>toast("分數沒存成功："+err.message));toast(`已儲存 ${byId(sel).name}：${Math.round(+v)} 分`)}
    const nl=gradeList(); let next;
    if(S.tFilter==="todo") next=nl.find(s=>s.id!==sel); else next=nl[pos+1];
    S.ver=null;
    if(next) go("t-grade",next.id); else {toast("這是最後一份了");go("t-grade",sel)}
  };
  $("#gNext").onclick=saveNext;
  $("#tsc").onkeydown=e=>{if(e.key==="Enter")saveNext()};
  $("#tcm").onkeydown=e=>{if(e.key==="Enter")saveNext()};
  if($("#tsc").value==="") $("#tsc").focus({preventScroll:true});
}

/* ================= 老師：小組簡報 ================= */
function viewTGroups(){
  const g=S.sel||1, ts=DB.tGroup[g];
  return `<div class="page-head"><div><h2>小組簡報評分</h2></div></div>
  <div class="split">
    <div class="card" style="padding:0">${ALLG.map(x=>`<div class="list-item ${x===g?"on":""}" data-tg="${x}"><span>第 ${x} 組</span><span class="muted" style="font-size:14px">${TOPICS[x-1]}</span><span class="spacer"></span>${DB.tGroup[x]?`<b style="color:var(--accent)">${DB.tGroup[x].score}</b>`:'<span class="pill grey">未評</span>'}</div>`).join("")}</div>
    <div>
      <div class="card" style="margin-bottom:16px"><div class="row"><h3 style="margin:0;font-size:20px">第 ${g} 組${TOPICS[g-1]?"｜"+TOPICS[g-1]:""}</h3><span class="spacer"></span>${PEER()?`<span class="muted">互評平均 ${peerReceived(g)??"—"} 分，平均第 ${rankReceived(g)??"—"} 名</span>`:""}${DB.pdfs[g]?`<button class="btn small" id="gdl">下載 ${esc(DB.pdfs[g].name)}</button>`:""}</div></div>
      ${!PEER()?"":(()=>{const rc=ALLG.filter(x=>DB.finals[x]).map(x=>({x,f:DB.finals[x]}));return `<details class="card" style="margin-bottom:16px" ${rc.length?"open":""}><summary style="cursor:pointer;font-weight:700;font-size:18px">其他組給第 ${g} 組的評分與評語（${rc.length} 組已送出）</summary>
        ${rc.length?`<table style="margin-top:10px"><thead><tr><th>評分組</th><th class="num">分數</th><th class="num">名次</th><th>評語</th></tr></thead><tbody>${rc.map(({x,f})=>`<tr><td>第 ${x} 組${x===g?'<span class="muted">（自評）</span>':""}</td><td class="num"><b>${f.scores[g]}</b></td><td class="num">第 ${f.ranks[g]} 名</td><td>${f.comments?.[g]?esc(f.comments[g]):'<span class="muted">—</span>'}</td></tr>`).join("")}</tbody></table>`:'<div class="muted" style="margin-top:8px">還沒有組別送出</div>'}</details>`})()}
      ${slidesHTML(g)}
    </div>
  </div>
  <div class="gradebar"><div class="in">
    <button class="btn" id="gp" ${g===1?"disabled":""}>← 上一組</button><b>第 ${g} 組</b>
    <input class="sc" id="gsc" type="number" inputmode="numeric" min="0" max="100" value="${ts?.score??""}" placeholder="分數">
    <input class="cm" id="gcm" value="${esc(ts?.comment||"")}" placeholder="評語（選填）">
    <button class="btn primary big" id="gn">${g<7?"儲存，下一組 →":"儲存"}</button></div></div>`;
}
function bindTGroups(){
  const g=S.sel||1;
  $$("[data-tg]").forEach(el=>el.onclick=()=>go("t-groups",+el.dataset.tg));
  const gd=$("#gdl"); if(gd) gd.onclick=async()=>{const p=DB.pdfs[g];if(p.kind==="sample"){toast("這是展示用的示意簡報，組長上傳真的 PDF 後就能下載");return}busy("正在下載…");try{const b=await reportBlob(g);busy();if(b)saveFile(p.name,b)}catch(e){busy();toast("下載失敗")}};
  $("#gp").onclick=()=>go("t-groups",g-1);
  const sv=()=>{const v=$("#gsc").value;if(v!==""){if(+v<0||+v>100){toast("分數要在 0 到 100 之間");return}DB.tGroup[g]={score:Math.round(+v),comment:$("#gcm").value.trim()};if(BACKEND)api("gradeGroup",{g,...DB.tGroup[g]}).catch(err=>toast("分數沒存成功："+err.message));toast(`已儲存第 ${g} 組`)}go("t-groups",g<7?g+1:g)};
  $("#gn").onclick=sv; $("#gsc").onkeydown=e=>{if(e.key==="Enter")sv()};
  mountPdfs();
}

/* ================= 老師：互評結果 ================= */
function viewTPeer(){
  const pg=S.sel?.g||1, pv=S.sel?.sid, pvStu=pv&&byId(pv), pvData=pv&&DB.peer[pv];
  return `<div class="page-head"><div><h2>小組互評結果</h2><div class="sub">每一列是評分的組別，每一欄是被評的組別，格子裡是「分數／名次」。</div></div><span class="spacer"></span>${downloadMenu()}</div>
  <div class="card" style="padding:0;overflow:auto"><table class="matrix">
    <thead><tr><th>評分組 ＼ 被評組</th>${ALLG.map(t=>`<th class="num">第 ${t} 組</th>`).join("")}</tr></thead>
    <tbody>${ALLG.map(g=>{const f=DB.finals[g];return `<tr><td>第 ${g} 組 ${f?`<span class="muted" style="font-size:14px">${fmtTime(f.at)}</span>`:'<span class="pill no">未送出</span>'}</td>${ALLG.map(t=>`<td class="num">${f?`${f.scores[t]}<span class="muted" style="font-size:14px">／第${f.ranks[t]}名</span>${f.comments?.[t]?' <span title="有評語" style="color:var(--gold)">●</span>':""}`:'<span class="cell-empty">—</span>'}</td>`).join("")}</tr>`}).join("")}
      <tr class="avg"><td>平均分數</td>${ALLG.map(t=>`<td class="num">${peerReceived(t)??"—"}</td>`).join("")}</tr>
      <tr class="avg"><td>平均名次</td>${ALLG.map(t=>`<td class="num">${rankReceived(t)??"—"}</td>`).join("")}</tr>
      <tr class="final"><td>老師評分</td>${ALLG.map(t=>`<td class="num">${DB.tGroup[t]?.score??"—"}</td>`).join("")}</tr></tbody></table></div>
  <h2 style="margin-top:32px">各組送出的評語</h2>
  <div class="muted" style="margin-bottom:12px">點開可以看到該組給七組的評語，以及整體評語。</div>
  ${ALLG.map(g=>{const f=DB.finals[g];return f?`<details class="card" style="margin-bottom:10px;padding:14px 18px"><summary style="cursor:pointer;font-weight:700;font-size:17px">第 ${g} 組的評分（${fmtTime(f.at)} 送出）${f.overall?'<span class="muted" style="font-weight:400">｜有整體評語</span>':""}</summary><div style="margin-top:10px">${finalTable(f)}</div></details>`:`<div class="card muted" style="margin-bottom:10px;padding:14px 18px">第 ${g} 組還沒送出</div>`}).join("")}
  <h2 style="margin-top:32px">每位學生的個人評分</h2>
  <div class="muted" style="margin-bottom:12px">選一組，再點學生姓名，可以看到他給每一組的分數和評語。<span style="color:var(--gold)">●</span> 表示有寫評語。</div>
  <div class="row" style="margin-bottom:12px">${ALLG.map(g=>`<button class="btn small ${g===pg?"primary":""}" data-pgp="${g}">第 ${g} 組</button>`).join("")}</div>
  ${memberMatrix(pg,{hiId:pv,clickable:true})}
  ${pvStu?`<div class="card" style="margin-top:16px" id="pvCard"><div class="row"><h3 style="margin:0">${esc(pvStu.name)}（${pvStu.id}）的個人評分</h3><span class="spacer"></span><span class="muted">已評 ${peerDone(pv)} / 7 組</span></div>
    ${pvData?`<table style="margin-top:10px"><thead><tr><th>被評組</th><th class="num">分數</th><th>評語</th></tr></thead><tbody>${ALLG.map(t=>{const v=pvData[t];return `<tr><td>第 ${t} 組${TOPICS[t-1]?"｜"+TOPICS[t-1]:""}${t===pvStu.group?' <span class="muted">（本組）</span>':""}</td><td class="num"><b>${v?.score??"—"}</b></td><td>${v?.comment?esc(v.comment):'<span class="muted">沒有評語</span>'}</td></tr>`}).join("")}</tbody></table>`:'<div class="muted" style="margin-top:10px">這位同學還沒有評分</div>'}</div>`:""}`;
}
function bindTPeer(){
  bindDownloadMenu();
  $$("[data-pgp]").forEach(b=>b.onclick=()=>go("t-peer",{g:+b.dataset.pgp}));
  $$("[data-pv]").forEach(r=>r.onclick=()=>{go("t-peer",{g:byId(r.dataset.pv).group,sid:r.dataset.pv});setTimeout(()=>$("#pvCard")?.scrollIntoView({behavior:"smooth",block:"center"}),50)});
}

/* ================= 路由 ================= */
function render(){
  if(S.flush){const f=S.flush;S.flush=null;f()}
  const app=$("#app"), u=S.user; S.leave=null; $("#modal").innerHTML="";
  applyZoom();
  if(!u){
    if(S.tab==="tlogin"){app.innerHTML=viewTeacherLogin();bindTLogin();return}
    if(!PUBLIC_TABS.includes(S.tab)) S.tab="home";
    app.innerHTML=publicShell(S.tab==="brief"?viewBrief():viewPublicHome());
    (S.tab==="brief"?bindBrief:bindPublic)();
    $("#openLogin").onclick=()=>openLogin(null);
    $("#tLogin").onclick=e=>{e.preventDefault();S.tab="tlogin";render()};
    $$("[data-tab]").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
    $$("[data-z]").forEach(b=>b.onclick=()=>{const d=+b.dataset.z;let i=ZL.indexOf(ZOOM);if(i<0)i=1;i=d===0?1:Math.max(0,Math.min(ZL.length-1,i+d));ZOOM=ZL[i];try{localStorage.setItem("hwZoom",ZOOM)}catch(e){}render()});
    window.scrollTo(0,0); return;
  }
  let tabs,V;
  if(u.teacher){
    tabs=[{k:"home",l:"首頁"},{k:"t-grade",l:"批改個人作業",b:ungraded().length||""},{k:"t-groups",l:"小組報告評分"},...(PEER()?[{k:"t-peer",l:"互評結果"}]:[]),{k:"brief",l:"作業說明"},{k:"t-settings",l:"⚙ 系統設定"}];
    if(S.tab==="t-peer"&&!PEER()) S.tab="home";
    V={"t-settings":[viewTSettings,bindTSettings],brief:[viewBrief,bindBrief],home:[viewTHome,bindTHome],"t-grade":[viewTGrade,bindTGrade],"t-groups":[viewTGroups,bindTGroups],"t-peer":[viewTPeer,bindTPeer]};
  }else{
    const mem=groupMembers(u.group), miss=mem.filter(s=>essayStatus(s.id)!=="submitted").length;
    tabs=[{k:"home",l:"首頁"},{k:"brief",l:"作業說明"},{k:"essay",l:"我的作業",b:essayStatus(u.id)==="submitted"?"":"!"},...(PEER()?[{k:"peer",l:ownUploaded(u)?"幫各組評分":"幫各組評分 🔒",b:ownUploaded(u)&&peerDone(u.id)<7?7-peerDone(u.id):""}]:[])];
    if(u.leader){tabs.splice(3,0,{k:"upload",l:"上傳簡報",b:DB.pdfs[u.group]?"":"!"});if(PEER())tabs.push({k:"gsubmit",l:"送出小組評分",b:DB.finals[u.group]?"":"!"});tabs.push({k:"members",l:"組員狀況",b:miss||""})}
    else if(PEER()) tabs.push({k:"matrix",l:"全組評分彙整"});
    if(!PEER()&&["peer","gsubmit","matrix"].includes(S.tab)) S.tab="home";
    V={brief:[viewBrief,bindBrief],home:[viewHome,bindHome],essay:[viewEssay,bindEssay],peer:[viewPeer,bindPeer],matrix:[viewMatrix],gsubmit:[viewGroupSubmit,bindGroupSubmit],members:[viewMembers,bindMembers],upload:[viewUpload,bindUpload]};
  }
  const [view,bind]=V[S.tab]||V.home;
  if(S.tab!=="essay") S.draft=null;
  if(S.tab!=="gsubmit") S.rk=null;
  app.innerHTML=shell(tabs,view());
  $("#logout").onclick=async()=>{if(S.leave&&S.leave()){const c=await dialog({title:"評分還沒儲存",body:"確定要登出嗎？還沒儲存的評分會不見。",buttons:[{l:"取消",v:false},{l:"登出",v:true,primary:true}]});if(!c)return}S={...S,user:null,token:null,tab:"home",sel:null,draft:null,leave:null};try{sessionStorage.removeItem("astmTok")}catch(e){}render();toast("已登出")};
  $$("[data-tab]").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
  $$("[data-z]").forEach(b=>b.onclick=()=>{const d=+b.dataset.z;let i=ZL.indexOf(ZOOM);if(i<0)i=1;i=d===0?1:Math.max(0,Math.min(ZL.length-1,i+d));ZOOM=ZL[i];try{localStorage.setItem("hwZoom",ZOOM)}catch(e){}render()});
  bind&&bind();
  window.scrollTo(0,0);
  bgRefresh();
}
setInterval(()=>{$$(".deadline").forEach(el=>{el.outerHTML=countdown()})},60000);
document.fonts?.ready?.then(()=>{if(S.user&&S.tab!=="essay")render()});
if(BACKEND){
  DB.students=[]; DB.settings.remindOn=true;
  $("#app").innerHTML='<div class="login-wrap"><div class="card" style="text-align:center"><b>載入中…</b></div></div>';
  let tok=null; try{tok=sessionStorage.getItem("astmTok")}catch(e){}
  (tok?(S.token=tok,api("refresh").then(r=>{applySnap(r.snapshot);S.user=r.user;S.tab="home";lastRefresh=Date.now();render()}).catch(()=>{S.token=null;return api("publicInfo").then(r=>{applySnap(r.snapshot);render()})}))
     :api("publicInfo").then(r=>{applySnap(r.snapshot);render()})).catch(e=>{$("#app").innerHTML=`<div class="login-wrap"><div class="card"><b>系統暫時無法使用</b><div class="muted">${esc(e.message)}</div></div></div>`});
}else render();
</script>
</body>
